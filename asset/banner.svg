<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="330" viewBox="0 0 800 330" role="img" aria-label="FunReminder - Your Aussie Reminder. GitHub Actions deploys Terraform to AWS: CloudFront, S3, API Gateway, Lambda, Bedrock, DynamoDB and EventBridge all linked together.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#1E2A4A"/>
    </linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="2"/></filter>
    <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#94A3B8"/>
    </marker>
    <clipPath id="round"><rect width="800" height="330" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="800" height="330" fill="url(#bg)"/>
    <!-- AWS region box: marching ants = Terraform applying -->
    <rect x="20" y="96" width="760" height="222" rx="16" fill="#F59E0B" fill-opacity="0.05" stroke="#34D399" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="8 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2.2s" repeatCount="indefinite"/>
    </rect>
    <text x="36" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#F59E0B" letter-spacing="1">AWS CLOUD</text>
    <text x="172" y="31" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#94A3B8">git push</text>
    <text x="300" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#6EE7B7">terraform apply</text>
    <!-- title -->
    <text x="780" y="40" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#fff">FunReminder</text>
    <text x="780" y="62" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#FDE68A">Your Aussie Reminder</text>
    <!-- links -->
  <path id="deploy1" d="M160 40 H235" fill="none" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <path id="deploy2" d="M290 62 V96" fill="none" stroke="#34D399" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <path id="uc" d="M135 185 C175 185 175 140 210 140" fill="none" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <path id="cs" d="M330 140 H390" fill="none" stroke="#22D3EE" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <path id="ua" d="M135 205 C175 205 175 250 210 250" fill="none" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <path id="al" d="M330 250 H390" fill="none" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <path id="lb" d="M510 243 C570 243 570 220 630 220" fill="none" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <path id="ld" d="M510 257 C570 257 570 282 630 282" fill="none" stroke="#A78BFA" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <path id="el" d="M630 140 C520 140 450 175 450 230" fill="none" stroke="#F472B6" stroke-opacity="0.45" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arr)"/>
  <path id="ret" d="M390 264 H210 C175 264 175 214 135 214" fill="none" stroke="#FDE68A" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="4 5" stroke-linecap="round" marker-end="url(#arr)"/>
    <!-- data packets flowing along the links -->
  <circle r="4.5" fill="#60A5FA" filter="url(#glow)"><animateMotion dur="1.6s" begin="0s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#deploy1"/></animateMotion></circle>
  <circle r="4.5" fill="#60A5FA" filter="url(#glow)"><animateMotion dur="1.6s" begin="1.0s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#deploy1"/></animateMotion></circle>
  <circle r="4.5" fill="#34D399" filter="url(#glow)"><animateMotion dur="1.0s" begin="0.3s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#deploy2"/></animateMotion></circle>
  <circle r="4.5" fill="#34D399" filter="url(#glow)"><animateMotion dur="1.0s" begin="1.1s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#deploy2"/></animateMotion></circle>
  <circle r="4.5" fill="#22D3EE" filter="url(#glow)"><animateMotion dur="2.4s" begin="0s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#uc"/></animateMotion></circle>
  <circle r="4.5" fill="#22D3EE" filter="url(#glow)"><animateMotion dur="2.4s" begin="1.5s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#uc"/></animateMotion></circle>
  <circle r="4.5" fill="#22D3EE" filter="url(#glow)"><animateMotion dur="2.4s" begin="0.4s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#cs"/></animateMotion></circle>
  <circle r="4.5" fill="#22D3EE" filter="url(#glow)"><animateMotion dur="2.4s" begin="1.9s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#cs"/></animateMotion></circle>
  <circle r="4.5" fill="#F59E0B" filter="url(#glow)"><animateMotion dur="2.4s" begin="0.8s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#ua"/></animateMotion></circle>
  <circle r="4.5" fill="#F59E0B" filter="url(#glow)"><animateMotion dur="2.4s" begin="2.3s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#ua"/></animateMotion></circle>
  <circle r="4.5" fill="#F59E0B" filter="url(#glow)"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#al"/></animateMotion></circle>
  <circle r="4.5" fill="#F59E0B" filter="url(#glow)"><animateMotion dur="2.4s" begin="2.7s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#al"/></animateMotion></circle>
  <circle r="4.5" fill="#A78BFA" filter="url(#glow)"><animateMotion dur="2.4s" begin="1.6s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#lb"/></animateMotion></circle>
  <circle r="4.5" fill="#A78BFA" filter="url(#glow)"><animateMotion dur="2.4s" begin="3.1s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#lb"/></animateMotion></circle>
  <circle r="4.5" fill="#A78BFA" filter="url(#glow)"><animateMotion dur="2.4s" begin="2.0s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#ld"/></animateMotion></circle>
  <circle r="4.5" fill="#A78BFA" filter="url(#glow)"><animateMotion dur="2.4s" begin="3.5s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#ld"/></animateMotion></circle>
  <circle r="4.5" fill="#F472B6" filter="url(#glow)"><animateMotion dur="2.6s" begin="0.2s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#el"/></animateMotion></circle>
  <circle r="4.5" fill="#F472B6" filter="url(#glow)"><animateMotion dur="2.6s" begin="1.8s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#el"/></animateMotion></circle>
  <circle r="4.5" fill="#FDE68A" filter="url(#glow)"><animateMotion dur="2.8s" begin="2.2s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#ret"/></animateMotion></circle>
  <circle r="4.5" fill="#FDE68A" filter="url(#glow)"><animateMotion dur="2.8s" begin="4.0s" repeatCount="indefinite" calcMode="linear"><mpath xlink:href="#ret"/></animateMotion></circle>
    <!-- services -->
  <g>
    <rect x="30.0" y="20.0" width="130" height="40" rx="10" fill="#111A33" stroke="#60A5FA" stroke-width="2"/>
    <text x="95" y="45" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">GitHub Actions</text>
  </g>
  <g>
    <rect x="235.0" y="20.0" width="110" height="40" rx="10" fill="#111A33" stroke="#34D399" stroke-width="2"/>
    <text x="290" y="45" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Terraform</text>
  </g>
  <g>
    <rect x="45.0" y="175.0" width="90" height="40" rx="10" fill="#111A33" stroke="#CBD5E1" stroke-width="2"/>
    <text x="90" y="200" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">User</text>
  </g>
  <g>
    <rect x="210.0" y="120.0" width="120" height="40" rx="10" fill="#111A33" stroke="#22D3EE" stroke-width="2"/>
    <text x="270" y="145" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">CloudFront</text>
  </g>
  <g>
    <rect x="390.0" y="120.0" width="120" height="40" rx="10" fill="#111A33" stroke="#22D3EE" stroke-width="2"/>
    <text x="450" y="145" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">S3</text>
  </g>
  <g>
    <rect x="630.0" y="120.0" width="120" height="40" rx="10" fill="#111A33" stroke="#F472B6" stroke-width="2"/>
    <text x="690" y="145" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">EventBridge</text>
  </g>
  <g>
    <rect x="210.0" y="230.0" width="120" height="40" rx="10" fill="#111A33" stroke="#F59E0B" stroke-width="2"/>
    <text x="270" y="255" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">API Gateway</text>
  </g>
  <g>
    <rect x="390.0" y="230.0" width="120" height="40" rx="10" fill="#111A33" stroke="#F59E0B" stroke-width="2"/>
    <text x="450" y="255" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Lambda</text>
  </g>
  <g>
    <rect x="630.0" y="200.0" width="120" height="40" rx="10" fill="#111A33" stroke="#A78BFA" stroke-width="2"/>
    <text x="690" y="225" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Bedrock</text>
  </g>
  <g>
    <rect x="630.0" y="262.0" width="120" height="40" rx="10" fill="#111A33" stroke="#A78BFA" stroke-width="2"/>
    <text x="690" y="287" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">DynamoDB</text>
  </g>
  </g>
</svg>
