<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DeMinh DeRozan · Reminders</title>
    <link rel="icon" type="image/png" sizes="64x64" href="https://d28igba62yy5is.cloudfront.net/kangaroo.png">
    <style>
        :root {
            --bg: #000000;
            --surface: #101010;
            --ink: #e8e5dd;
            --muted: #7d7a72;
            --line: #222220;
            --user: #1a1a18;
            --accent: #d97757;
            --accent-ink: #ffffff;
            --alarm: #f5b800;
            --alarm-bg: #0d0d0c;
            --alarm-fg: #faf8f2;
            --success: #34c759;
            --fail: #ff453a;
            --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
            --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--ink);
        }

        /* ===== Ambient: analog clock watermark ===== */
        .clock-face {
            position: fixed; inset: 0; z-index: 0;
            display: grid; place-items: center;
            pointer-events: none; color: var(--ink);
            --clock-base: 0.10; opacity: var(--clock-base);
            transition: opacity .6s ease;
        }
        .clock-svg { width: min(74vmin, 540px); height: min(74vmin, 540px); }
        .clock-svg line { stroke: currentColor; stroke-linecap: round; }
        #hourHand { opacity: .92; }
        #minuteHand { opacity: .80; }
        #secondHand { opacity: .95; }
        .clock-pin { fill: currentColor; }
        @keyframes clockFlash {
            0%   { opacity: var(--clock-base); filter: none; }
            10%  { opacity: 1;   filter: drop-shadow(0 0 26px rgba(245,184,0,.9)); }
            30%  { opacity: .45; filter: drop-shadow(0 0 10px rgba(245,184,0,.5)); }
            50%  { opacity: .98; filter: drop-shadow(0 0 20px rgba(245,184,0,.7)); }
            70%  { opacity: .55; filter: drop-shadow(0 0 8px rgba(245,184,0,.4)); }
            100% { opacity: var(--clock-base); filter: none; }
        }
        .clock-face.flashing { animation: clockFlash 1.8s cubic-bezier(.2,.8,.2,1); }

        .alarm-flash {
            position: fixed; inset: 0; z-index: 9998;
            pointer-events: none; opacity: 0;
            background: radial-gradient(circle at 50% 50%, rgba(245,184,0,0.55), rgba(245,184,0,0.05) 55%, transparent 75%);
        }

        .wrapper {
            position: relative; z-index: 1;
            display: flex; flex-direction: column; height: 100%;
            max-width: 760px; margin: 0 auto;
        }

        /* ============================================================
           USER AVATAR + POPOVER  ← NEW
           ============================================================ */
        .user-avatar-btn {
            position: absolute;
            top: 14px;
            right: 18px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid var(--line);
            background: var(--surface);
            cursor: pointer;
            overflow: hidden;
            padding: 0;
            z-index: 50;
            display: none;            /* toggled via JS */
            align-items: center;
            justify-content: center;
            color: var(--ink);
            font-family: var(--serif);
            font-size: 16px;
            font-weight: 700;
            transition: transform .15s, border-color .2s, box-shadow .2s;
        }
        .user-avatar-btn:hover { border-color: var(--accent); }
        .user-avatar-btn:active { transform: scale(.94); }
        .user-avatar-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .user-avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .user-avatar-btn span { display: block; line-height: 1; }

        /* Khi đã login, đẩy đồng hồ sang trái nhường chỗ cho avatar */
        .wrapper.logged-in .clock-block { padding-right: 52px; }

        .user-popover {
            position: absolute;
            top: 60px;
            right: 18px;
            width: 280px;
            max-width: calc(100vw - 24px);
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.7);
            z-index: 60;
            padding: 16px;
            opacity: 0;
            visibility: hidden;
            transform: translateY(-6px) scale(.97);
            transition: opacity .18s, transform .18s, visibility .18s;
        }
        .user-popover.open {
            opacity: 1; visibility: visible; transform: none;
        }
        .user-popover-head {
            display: flex; align-items: center; gap: 12px;
            padding-bottom: 14px; border-bottom: 1px solid var(--line);
            margin-bottom: 12px;
        }
        .user-popover-avatar {
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--user); overflow: hidden; flex: none;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--serif); font-size: 18px; font-weight: 700;
            color: var(--ink);
        }
        .user-popover-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .user-popover-info { min-width: 0; flex: 1; }
        .user-popover-name {
            font-family: var(--serif); font-size: 14px; font-weight: 700;
            color: var(--ink);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .user-popover-email {
            font-family: var(--mono); font-size: 11px; color: var(--muted);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-top: 3px;
        }
        .user-popover-links { display: flex; flex-direction: column; gap: 2px; }
        .user-popover-links a {
            display: flex; align-items: center; gap: 8px;
            padding: 9px 10px;
            color: var(--ink); text-decoration: none;
            font-size: 13px;
            border-radius: 8px;
            transition: background .15s;
        }
        .user-popover-links a:hover { background: var(--user); }
        .user-popover-links a .icon { font-size: 14px; width: 18px; text-align: center; }
        .user-popover-logout {
            width: 100%; margin-top: 10px; padding: 10px;
            border: 1px solid var(--line); background: transparent;
            color: var(--fail);
            border-radius: 10px;
            font-family: inherit; font-size: 13px; font-weight: 600;
            cursor: pointer; transition: .15s;
        }
        .user-popover-logout:hover {
            background: rgba(255,69,58,.1);
            border-color: rgba(255,69,58,.4);
        }
        .user-popover-logout:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        @media (max-width: 560px) {
            .user-avatar-btn { top: 10px; right: 12px; width: 34px; height: 34px; font-size: 14px; }
            .user-popover { top: 52px; right: 12px; }
            .wrapper.logged-in .clock-block { padding-right: 46px; }
        }

        /* ===== Notification banner ===== */
        .notif-banner {
            position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
            z-index: 9997;
            background: var(--surface);
            border: 1px solid var(--accent);
            border-radius: 999px;
            padding: 8px 16px;
            font-size: 12.5px; font-weight: 600; color: var(--ink);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            max-width: calc(100vw - 32px);
            transition: opacity .3s;
        }
        .notif-banner.hidden { display: none; }
        .notif-banner.blocked { border-color: var(--muted); color: var(--muted); cursor: default; }

        /* ===== Header ===== */
        .header {
            padding: 14px 18px 10px;
            display: grid;
            grid-template-columns: 1fr auto;
            grid-template-areas: "who clock" "actions progress";
            gap: 8px 14px; align-items: start;
        }
        .who { grid-area: who; display: flex; align-items: center; gap: 10px; min-width: 0; }
        .logo {
            width: 38px; height: 38px; border-radius: 50%;
            overflow: hidden; cursor: pointer; flex: none;
            border: 1px solid var(--line); transition: transform .15s ease;
        }
        .logo:active, .spark:active { transform: scale(.94); }
        .logo img { width: 100%; height: 100%; object-fit: cover; object-position: center 12%; display: block; }
        .logo svg { width: 18px; height: 18px; display: none; }
        .name {
            font-family: var(--serif);
            font-size: 16px; font-weight: 700; letter-spacing: -.2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px rgba(52,199,89,.2); }

        .clock-block { grid-area: clock; text-align: right; user-select: none; transition: padding .25s ease; }
        .clock-main {
            font-family: var(--mono); font-size: 26px; font-weight: 600;
            letter-spacing: 0.02em; line-height: 1; font-variant-numeric: tabular-nums;
            color: var(--ink); display: inline-flex; align-items: baseline; gap: 1px;
        }
        .clock-main .sec { font-size: 14px; opacity: 0.55; font-weight: 500; }
        .clock-date {
            font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.18em;
            text-transform: uppercase; color: var(--muted); margin-top: 4px;
        }

        .progress {
            grid-area: progress; display: flex; align-items: center; gap: 8px;
            font-family: var(--mono); font-size: 9.5px; color: var(--muted);
            letter-spacing: 0.12em; text-transform: uppercase;
        }
        .progress-track { flex: 1; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; min-width: 60px; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 1s linear; }

        .actions { grid-area: actions; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .ghost-btn {
            background: transparent; border: 1px solid var(--line); color: var(--muted);
            border-radius: 999px; padding: 5px 11px;
            font-size: 11.5px; cursor: pointer; transition: .2s;
            font-family: inherit; white-space: nowrap;
        }
        .ghost-btn:hover { color: var(--ink); border-color: var(--muted); }
        .ghost-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .ghost-btn.has-badge { position: relative; }
        .ghost-btn.has-badge::after {
            content: attr(data-badge); position: absolute; top: -4px; right: -4px;
            background: var(--accent); color: var(--accent-ink);
            font-family: var(--mono); font-size: 9px; font-weight: 700;
            min-width: 16px; height: 16px; border-radius: 999px;
            display: grid; place-items: center; padding: 0 4px;
        }

        @media (max-width: 560px) {
            .header { padding: 10px 12px 8px; gap: 6px 10px; }
            .clock-main { font-size: 22px; }
            .clock-main .sec { font-size: 12px; }
            .name { font-size: 14px; }
            .ghost-btn { padding: 4px 8px; font-size: 10.5px; }
            .actions { gap: 4px; }
        }

        /* ===== Chat ===== */
        .chat-box {
            flex: 1; overflow-y: auto;
            padding: 12px 18px 20px;
            display: flex; flex-direction: column; gap: 0;
            scroll-behavior: smooth;
        }
        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

        .row { display: flex; gap: 10px; animation: in .35s ease-out; align-items: flex-start; }
        .row.user { justify-content: flex-end; }
        .row.remind-alert { justify-content: center; margin: 8px 0; }

        .row .spark {
            flex: none; width: 32px; height: 32px; border-radius: 50%;
            overflow: hidden; cursor: pointer; transition: transform .15s ease;
        }
        .spark img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: center 12%; display: block; }
        .spark svg { width: 14px; height: 14px; }

        .msg { font-size: 15.5px; line-height: 1.6; word-wrap: break-word; white-space: pre-wrap; max-width: 85%; }
        .msg.bot { color: var(--ink); padding-top: 4px; }
        .row.user .msg, .msg.user {
            max-width: 80%; background: var(--user);
            padding: 10px 16px; border-radius: 22px 22px 6px 22px;
        }

        .msg-time {
            font-family: var(--mono); font-size: 10px; color: var(--muted);
            letter-spacing: 0.04em; margin-top: 3px; padding: 0 4px;
            opacity: 0.75; user-select: none;
        }
        .row.user .msg-time { text-align: right; }

        .msg.aged  { opacity: 0.82; }
        .msg.old   { opacity: 0.6; filter: saturate(0.9); }
        .msg.fossil { opacity: 0.38; filter: saturate(0.6) blur(0.15px); }
        .msg.fossil:hover { opacity: 0.75; filter: none; transition: .3s; }

        .time-gap-marker {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-family: var(--mono); font-size: 10px; color: var(--muted);
            letter-spacing: 0.15em; text-transform: uppercase;
            opacity: 0.65; padding: 0 8px;
        }
        .time-gap-marker .line {
            flex: 1; height: 1px;
            background: linear-gradient(90deg, transparent, var(--line) 30%, var(--line) 70%, transparent);
            max-width: 90px;
        }

        /* ===== Alarm card ===== */
        .alarm-card {
            max-width: 95%; background: var(--alarm-bg); color: var(--alarm-fg);
            border-radius: 14px; padding: 14px 18px 16px;
            box-shadow: 0 6px 28px rgba(245,184,0,0.18), 0 2px 8px rgba(0,0,0,0.2);
            animation: alarmPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(245,184,0,0.35);
        }
        .alarm-label {
            font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em;
            text-transform: uppercase; color: var(--alarm);
            display: flex; align-items: center; gap: 6px;
            font-weight: 700; margin-bottom: 8px;
        }
        .alarm-label::before { content: "▲"; font-size: 11px; }
        .alarm-task {
            font-family: var(--serif); font-size: 17px; font-weight: 700;
            line-height: 1.3; letter-spacing: -.005em; word-wrap: break-word;
        }
        .alarm-time {
            font-family: var(--mono); font-size: 10px; opacity: 0.5;
            letter-spacing: 0.1em; margin-top: 10px; text-transform: uppercase;
        }
        .alarm-actions {
            display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap;
        }
        .alarm-action-btn {
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(245,184,0,.4);
            color: var(--alarm); border-radius: 999px;
            padding: 6px 12px; font-size: 12px;
            font-family: inherit; cursor: pointer;
            transition: .2s;
        }
        .alarm-action-btn:hover:not(:disabled) { background: rgba(245,184,0,.15); }
        .alarm-action-btn:disabled { opacity: .5; cursor: default; }
        .alarm-action-btn.success { border-color: var(--success); color: var(--success); background: rgba(52,199,89,.12); }
        .alarm-action-btn.fail    { border-color: var(--fail);    color: var(--fail);    background: rgba(255,69,58,.12); }
        @keyframes alarmPop {
            from { opacity: 0; transform: translateY(6px) scale(.96); }
            to   { opacity: 1; transform: none; }
        }

        .typing { display: inline-flex; gap: 4px; align-items: center; height: 24px; }
        .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
        .typing i:nth-child(2) { animation-delay: .15s; }
        .typing i:nth-child(3) { animation-delay: .3s; }
        @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }
        @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        /* ===== Chips ===== */
        .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 18px 10px; scrollbar-width: none; }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            flex: none; background: var(--surface); border: 1px solid var(--line); color: var(--ink);
            border-radius: 999px; padding: 8px 14px; font-size: 13px; cursor: pointer;
            transition: .2s; box-shadow: 0 1px 8px rgba(0,0,0,0.3); font-family: inherit;
        }
        .chip:hover { border-color: var(--accent); transform: translateY(-1px); }
        .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* ===== Familiar bar ===== */
        .familiar-bar {
            display: none; gap: 6px; overflow-x: auto;
            padding: 4px 18px 8px; scrollbar-width: none; align-items: center;
        }
        .familiar-bar.show { display: flex; }
        .familiar-bar::-webkit-scrollbar { display: none; }
        .familiar-label {
            font-family: var(--mono); font-size: 10px; color: var(--muted);
            letter-spacing: 0.1em; text-transform: uppercase; flex: none;
        }
        .familiar-chip {
            flex: none; background: var(--surface); border: 1px solid var(--line); color: var(--ink);
            border-radius: 999px; padding: 6px 12px; font-size: 12px;
            cursor: pointer; font-family: inherit; transition: .2s;
            display: flex; align-items: center; gap: 6px;
        }
        .familiar-chip:hover { border-color: var(--accent); }
        .familiar-chip .count {
            font-family: var(--mono); font-size: 9.5px; color: var(--muted);
            padding: 1px 5px; background: var(--user); border-radius: 999px;
        }

        /* ===== Composer ===== */
        .composer { padding: 0 18px calc(14px + env(safe-area-inset-bottom)); position: relative; }

        .repeat-row {
            display: flex; gap: 6px; align-items: center;
            padding: 0 4px 8px; overflow-x: auto; scrollbar-width: none;
        }
        .repeat-row::-webkit-scrollbar { display: none; }
        .repeat-label {
            font-family: var(--mono); font-size: 10px; color: var(--muted);
            letter-spacing: 0.1em; text-transform: uppercase; flex: none;
        }
        .repeat-chip {
            flex: none; background: transparent; border: 1px solid var(--line);
            color: var(--muted); border-radius: 999px; padding: 4px 10px;
            font-size: 11px; cursor: pointer; font-family: inherit; transition: .2s;
        }
        .repeat-chip.active { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
        .repeat-chip:hover:not(.active) { color: var(--ink); border-color: var(--muted); }

        .input-bar {
            display: flex; align-items: center; gap: 8px; background: var(--surface);
            border: 1px solid var(--line); border-radius: 28px; padding: 6px 6px 6px 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4); transition: .2s;
        }
        .input-bar:focus-within {
            border-color: transparent;
            box-shadow: 0 0 0 2px var(--accent), 0 6px 26px rgba(217,119,87,.18);
        }
        input {
            flex: 1; min-width: 0; border: none; background: transparent; color: var(--ink);
            padding: 10px 0; outline: none; font-size: 16px; font-family: inherit;
        }
        input::placeholder { color: var(--muted); }
        .send {
            flex: none; width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
            background: var(--accent); color: var(--accent-ink);
            display: flex; align-items: center; justify-content: center; transition: .2s;
        }
        .send:hover:not(:disabled) { transform: scale(1.06); filter: brightness(1.05); }
        .send:active:not(:disabled) { transform: scale(.94); }
        .send:disabled { opacity: .35; cursor: default; }
        .send:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        .send svg { width: 18px; height: 18px; }
        .hint { font-size: 11px; color: var(--muted); text-align: center; padding-top: 8px; }
        .hint a { color: inherit; }

        .scroll-bottom {
            position: absolute; top: -52px; right: 22px;
            width: 34px; height: 34px; border-radius: 50%;
            background: var(--surface); border: 1px solid var(--line);
            color: var(--ink); cursor: pointer; font-size: 15px; line-height: 1;
            box-shadow: 0 2px 12px rgba(0,0,0,0.5);
            opacity: 0; transform: scale(.85); pointer-events: none;
            transition: opacity .2s, transform .2s; z-index: 10;
            display: flex; align-items: center; justify-content: center;
        }
        .scroll-bottom.show { opacity: 1; transform: scale(1); pointer-events: auto; }
        .scroll-bottom:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .sound-banner {
            margin: 0 18px 8px; padding: 9px 14px;
            border-radius: 12px; text-align: center; cursor: pointer;
            font-size: 13px; font-weight: 600; color: var(--ink); background: var(--surface);
            border: 1px solid var(--accent);
            box-shadow: 0 2px 10px rgba(217,119,87,.15); user-select: none;
        }
        .sound-banner.hidden { display: none; }

        .confirm-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .confirm-btn {
            border: 1px solid var(--line); background: var(--surface); color: var(--ink);
            border-radius: 999px; padding: 9px 16px; font-size: 13.5px; font-family: inherit;
            cursor: pointer; transition: .2s;
        }
        .confirm-btn.yes { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
        .confirm-btn:hover:not(:disabled) { transform: translateY(-1px); }
        .confirm-btn:active:not(:disabled) { transform: scale(.96); }
        .confirm-btn:disabled { opacity: .45; cursor: default; }
        .confirm-btn.picked:disabled { opacity: 1; }
        .confirm-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* ===== History panel ===== */
        .history-panel {
            position: fixed; inset: 0; z-index: 9996;
            background: rgba(0,0,0,.75);
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            opacity: 0; visibility: hidden;
            transition: opacity .22s, visibility .22s;
            display: flex; align-items: flex-end; justify-content: center;
        }
        .history-panel.open { opacity: 1; visibility: visible; }
        .history-sheet {
            width: 100%; max-width: 760px; max-height: 82vh;
            background: var(--surface);
            border-radius: 20px 20px 0 0;
            display: flex; flex-direction: column;
            transform: translateY(20px); transition: transform .22s;
        }
        .history-panel.open .history-sheet { transform: none; }
        .history-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; border-bottom: 1px solid var(--line);
        }
        .history-header h2 { font-family: var(--serif); font-size: 18px; margin: 0; letter-spacing: -.2px; }
        .history-close {
            width: 32px; height: 32px; border: none; background: transparent;
            color: var(--muted); font-size: 24px; cursor: pointer; border-radius: 50%;
        }
        .history-close:hover { background: var(--user); color: var(--ink); }
        .history-body { flex: 1; overflow-y: auto; padding: 8px 12px 20px; }
        .history-empty { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 20px; }
        .history-item {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 12px; border-radius: 12px; cursor: pointer; transition: .15s;
        }
        .history-item:hover { background: var(--user); }
        .history-item-icon { font-size: 18px; flex: none; }
        .history-item-content { flex: 1; min-width: 0; }
        .history-item-task { font-size: 14px; color: var(--ink); word-wrap: break-word; }
        .history-item-meta {
            font-family: var(--mono); font-size: 10px; color: var(--muted);
            letter-spacing: 0.04em; margin-top: 3px;
        }
        .history-footer {
            padding: 12px 20px; border-top: 1px solid var(--line);
            display: flex; gap: 8px; justify-content: flex-end;
        }
        .history-footer button {
            background: transparent; border: 1px solid var(--line); color: var(--muted);
            border-radius: 999px; padding: 8px 16px;
            font-size: 12.5px; font-family: inherit; cursor: pointer;
        }
        .history-footer button:hover { color: var(--ink); border-color: var(--muted); }
        .history-footer .danger { color: var(--fail); border-color: rgba(255,69,58,.4); }
        .history-footer .danger:hover { background: rgba(255,69,58,.1); }

        /* ===== Lightbox ===== */
        .lb {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,.92);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            opacity: 0; visibility: hidden;
            transition: opacity .22s ease, visibility .22s;
        }
        .lb.open { opacity: 1; visibility: visible; }
        .lb img {
            max-width: 94vw; max-height: 86vh; object-fit: contain;
            border-radius: 6px; box-shadow: 0 10px 50px rgba(0,0,0,.6);
            transform: scale(.88); opacity: .6;
            transition: transform .25s cubic-bezier(.2,.8,.2,1), opacity .25s ease;
            user-select: none;

        .lb.open img { transform: scale(1); opacity: 1; }
        .lb-close {
            position: absolute; top: 14px; right: 16px;
            width: 40px; height: 40px; border: none; border-radius: 50%;
            background: rgba(255,255,255,.14); color: #fff;
            font-size: 24px; line-height: 1; cursor: pointer;
        }
        .lb-close:hover { background: rgba(255,255,255,.26); }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>

<script>
    /* ============================================================
       DOM refs
       ============================================================ */
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const chips = document.getElementById('chips');
    const familiarBar = document.getElementById('familiarBar');
    const sendBtn = document.getElementById('sendBtn');
    const scrollBottom = document.getElementById('scrollBottom');
    const alarmFlash = document.getElementById('alarmFlash');
    const clockHM = document.getElementById('clockHM');
    const clockSec = document.getElementById('clockSec');
    const clockDate = document.getElementById('clockDate');
    const progressFill = document.getElementById('progressFill');
    const progressPct = document.getElementById('progressPct');
    const notifBanner = document.getElementById('notifBanner');
    const notifBannerIcon = document.getElementById('notifBannerIcon');
    const notifBannerText = document.getElementById('notifBannerText');

    const audioList = [
        'https://d28igba62yy5is.cloudfront.net/audio.mp3',
        'https://d28igba62yy5is.cloudfront.net/audioo.mp3'
    ];
    let currentAudioObj = new Audio(audioList[0]);
    currentAudioObj.volume = 0.8;

    const SEND_URL  = "https://rpjf4296xk.execute-api.ap-southeast-2.amazonaws.com/Production/reminder";
    const CHECK_URL = "https://rpjf4296xk.execute-api.ap-southeast-2.amazonaws.com/Production/check";
    const AUDIO_BASE_URL = "https://d28igba62yy5is.cloudfront.net/";
    const FETCH_TIMEOUT_MS = 28000;
    const POLL_MS = 15000;
    const ORIGINAL_TITLE = document.title;
    const DEDUPE_TTL = 60 * 1000;

    const ALARM_HISTORY_KEY = 'mate_alarm_history_v1';
    const MAX_ALARM_HISTORY = 100;

    const SPARK_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.6 5.2 4.8 9.4 10 10-5.2.6-9.4 4.8-10 10-.6-5.2-4.8-9.4-10-10 5.2-.6 9.4-4.8 10-10z"/></svg>';
    const ROO_IMG = 'https://d28igba62yy5is.cloudfront.net/kangaroo.png';

    /* ============================================================
       ANALOG CLOCK WATERMARK
       ============================================================ */
    const clockFace  = document.getElementById('clockFace');
    const hourHand   = document.getElementById('hourHand');
    const minuteHand = document.getElementById('minuteHand');
    const secondHand = document.getElementById('secondHand');

    (function buildClockTicks() {
        const g = document.getElementById('clockTicks');
        const NS = 'http://www.w3.org/2000/svg';
        for (let i = 0; i < 12; i++) {
            const major = i % 3 === 0;
            const outer = 90, inner = major ? 76 : 82;
            const line = document.createElementNS(NS, 'line');
            line.setAttribute('x1', 100);
            line.setAttribute('y1', 100 - outer);
            line.setAttribute('x2', 100);
            line.setAttribute('y2', 100 - inner);
            line.setAttribute('stroke-width', major ? 2 : 1.4);
            line.setAttribute('transform', `rotate(${i * 30} 100 100)`);
            g.appendChild(line);
        }
    })();

    function updateClockHands(now) {
        const s = now.getSeconds() + now.getMilliseconds() / 1000;
        const m = now.getMinutes() + s / 60;
        const h = (now.getHours() % 12) + m / 60;
        secondHand.setAttribute('transform', `rotate(${(s * 6).toFixed(2)} 100 100)`);
        minuteHand.setAttribute('transform', `rotate(${(m * 6).toFixed(3)} 100 100)`);
        hourHand.setAttribute('transform',   `rotate(${(h * 30).toFixed(3)} 100 100)`);
    }

    let clockFlashTimer = null;
    function flashClock() {
        clockFace.classList.remove('flashing');
        void clockFace.offsetWidth;
        clockFace.classList.add('flashing');
        clearTimeout(clockFlashTimer);
        clockFlashTimer = setTimeout(() => clockFace.classList.remove('flashing'), 1900);
    }

    /* ============================================================
       LIVE CLOCK
       ============================================================ */
    function fmtHM(d) { return d.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', hour12: false }); }
    function fmtSec(d) { return ':' + String(d.getSeconds()).padStart(2, '0'); }
    function fmtDate(d) {
        const dd = String(d.getDate()).padStart(2, '0');
        const wd = ['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()];
        const mo = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][d.getMonth()];
        return `${wd} ${dd} ${mo}`;
    }

    let lastSec = -1;
    function tickClock() {
        const now = new Date();
        updateClockHands(now);
        const sec = now.getSeconds();
        if (sec !== lastSec) {
            lastSec = sec;
            clockHM.textContent = fmtHM(now);
            clockSec.textContent = fmtSec(now);
            clockDate.textContent = fmtDate(now);
            const dayMs = 24 * 3600 * 1000;
            const passedMs = (now.getHours() * 3600 + now.getMinutes() * 60 + sec) * 1000;
            const pct = Math.min(100, (passedMs / dayMs) * 100);
            progressFill.style.width = pct.toFixed(2) + '%';
            progressPct.textContent = Math.round(pct) + '%';
        }
        requestAnimationFrame(tickClock);
    }
    tickClock();

    /* ============================================================
       TIME GAPS + AGING
       ============================================================ */
    let lastMessageAt = 0;

    function formatGapLabel(ms) {
        const m = Math.round(ms / 60000);
        if (m < 60) return m + ' min later';
        if (m < 1440) return Math.round(m / 60) + ' hr later';
        const d = Math.round(m / 1440);
        return d === 1 ? 'next day' : d + ' days later';
    }
    function gapPx(ms) {
        const minutes = ms / 60000;
        return Math.min(90, Math.max(14, Math.log2(minutes) * 10));
    }
    function ageClass(atMs) {
        const age = Date.now() - atMs;
        if (age > 7 * 86400e3) return 'fossil';
        if (age > 86400e3)     return 'old';
        if (age > 3600e3)      return 'aged';
        return '';
    }
    function applyGapAndAge(rowEl, atMs, skipGap) {
        const msgEl = rowEl.querySelector('.msg');
        const cls = ageClass(atMs);
        if (cls && msgEl) msgEl.classList.add(cls);
        if (!skipGap && lastMessageAt > 0) {
            const gap = atMs - lastMessageAt;
            if (gap > 60 * 1000) {
                const px = gapPx(gap);
                rowEl.style.marginTop = px + 'px';
                if (gap > 30 * 60 * 1000) {
                    const marker = document.createElement('div');
                    marker.className = 'time-gap-marker';
                    marker.innerHTML = `<span class="line"></span><span>${formatGapLabel(gap)}</span><span class="line"></span>`;
                    marker.style.marginBottom = '4px';
                    chatBox.insertBefore(marker, rowEl);
                }
            } else {
                rowEl.style.marginTop = '10px';
            }
        }
        lastMessageAt = atMs;
    }

    function flashAlarm() {
        alarmFlash.animate(
            [{ opacity: 1 }, { opacity: 0 }],
            { duration: 1400, easing: 'ease-out' }
        );
    }

    /* ============================================================
       USER ID / AUTH
       ============================================================ */
    function getUserId() {
        try {
            let id = localStorage.getItem('mate_user_id');
            if (!id) {
                id = (crypto.randomUUID ? crypto.randomUUID() : 'u-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10));
                localStorage.setItem('mate_user_id', id);
            }
            return id;
        } catch (e) {
            return 'u-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
        }
    }
    const USER_ID = getUserId();

    const AUTH_CFG = {
        domain:   "https://YOUR-DOMAIN.auth.ap-southeast-2.amazoncognito.com",
        clientId: "YOUR_APP_CLIENT_ID",
        redirect: location.origin + location.pathname,
        scope:    "openid email profile"
    };
    const AUTH_KEY = 'mate_auth';
    const GUEST_MAX = 2;
    let authNote = '';

    function b64url(bytes) {
        let s = '';
        new Uint8Array(bytes).forEach(b => { s += String.fromCharCode(b); });
        return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function randomString(n) { return b64url(crypto.getRandomValues(new Uint8Array(n))); }
    function readAuth() {
        try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) { return null; }
    }
    function writeAuth(a) {
        try { if (a) localStorage.setItem(AUTH_KEY, JSON.stringify(a)); else localStorage.removeItem(AUTH_KEY); } catch (e) {}
    }
    function jwtPayload(jwt) {
        try {
            const p = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(p), c => c.charCodeAt(0))));
        } catch (e) { return {}; }
    }
    function currentUser() {
        const a = readAuth();
        return a && a.id ? jwtPayload(a.id) : null;
    }

    async function startLogin() {
        const verifier = randomString(48);
        const state = randomString(16);
        const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
        sessionStorage.setItem('mate_pkce', JSON.stringify({ verifier, state }));
        location.href = AUTH_CFG.domain + '/oauth2/authorize?' + new URLSearchParams({
            response_type: 'code',
            client_id: AUTH_CFG.clientId,
            redirect_uri: AUTH_CFG.redirect,
            scope: AUTH_CFG.scope,
            state,
            code_challenge_method: 'S256',
            code_challenge: challenge,
            identity_provider: 'Google'
        });
    }

    async function tokenRequest(params) {
        const res = await fetch(AUTH_CFG.domain + '/oauth2/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ client_id: AUTH_CFG.clientId, ...params })
        });
        if (!res.ok) throw new Error('token endpoint ' + res.status);
        return res.json();
    }

    function storeTokens(t, old) {
        const a = {
            access:  t.access_token,
            id:      t.id_token      || (old && old.id),
            refresh: t.refresh_token || (old && old.refresh),
            exp:     Date.now() + (t.expires_in || 3600) * 1000
        };
        writeAuth(a);
        return a;
    }

    async function handleAuthCallback() {
        const p = new URLSearchParams(location.search);
        if (!p.has('code') && !p.has('error')) return;
        if (p.has('error')) console.warn('Cognito login error:', p.get('error'), p.get('error_description'));
        window.history.replaceState(null, '', location.pathname);
        const saved = JSON.parse(sessionStorage.getItem('mate_pkce') || 'null');
        sessionStorage.removeItem('mate_pkce');
        if (p.has('error') || !saved || p.get('state') !== saved.state) {
            authNote = "Login didn't go through, mate. Give it another crack.";
            return;
        }
        try {
            storeTokens(await tokenRequest({
                grant_type: 'authorization_code',
                code: p.get('code'),
                redirect_uri: AUTH_CFG.redirect,
                code_verifier: saved.verifier
            }));
            const u = currentUser();
            authNote = "Logged in" + (u && u.email ? " as " + u.email : "") + ". No more guest limit!";
        } catch (e) {
            console.error('Cognito token exchange failed:', e);
            authNote = "Login didn't go through, mate. Give it another crack.";
        }
    }

    async function getAccessToken() {
        let a = readAuth();
        if (!a) return null;
        if (Date.now() < a.exp - 60000) return a.access;
        if (!a.refresh) { writeAuth(null); renderAuthUI(); return null; }
        try {
            a = storeTokens(await tokenRequest({ grant_type: 'refresh_token', refresh_token: a.refresh }), a);
            return a.access;
        } catch (e) {
            writeAuth(null);
            renderAuthUI();
            return null;
        }
    }

    async function authHeaders() {
        const t = await getAccessToken();
        return t ? { Authorization: 'Bearer ' + t } : {};
    }

    /* ============================================================
       LOGOUT — có safety cho config placeholder
       ============================================================ */
    function logout() {
        writeAuth(null);
        closeUserPopover();

        // Nếu config vẫn là placeholder, không redirect Cognito (sẽ 404).
        if (AUTH_CFG.domain.includes('YOUR-DOMAIN')) {
            renderAuthUI();
            appendMessage("Logged out (placeholder config, no Cognito redirect).", 'bot', null, false);
            return;
        }

        location.href = AUTH_CFG.domain + '/logout?' + new URLSearchParams({
            client_id: AUTH_CFG.clientId,
            logout_uri: AUTH_CFG.redirect
        });
    }

    function authClick() { if (readAuth()) logout(); else startLogin(); }

    /* ============================================================
       USER AVATAR + POPOVER  ← NEW
       ============================================================ */
    function getInitial(u) {
        const n = (u && (u.name || u.given_name)) || '';
        const e = (u && u.email) || '';
        return (n || e || 'U').trim().charAt(0).toUpperCase() || 'U';
    }
    function getPicture(u) {
        return (u && (u.picture || u.picture_url)) || null;
    }

    function setAvatarImages(u) {
        const pic = getPicture(u);
        const initial = getInitial(u);

        // Small avatar button
        const smallImg = document.getElementById('userAvatarImg');
        const smallInitial = document.getElementById('userAvatarInitial');
        if (pic) {
            smallImg.src = pic;
            smallImg.style.display = 'block';
            smallInitial.style.display = 'none';
            smallImg.onerror = () => {
                smallImg.style.display = 'none';
                smallInitial.style.display = 'block';
                smallInitial.textContent = initial;
            };
        } else {
            smallImg.style.display = 'none';
            smallInitial.style.display = 'block';
            smallInitial.textContent = initial;
        }

        // Popover avatar
        const bigImg = document.getElementById('popoverAvatarImg');
        const bigInitial = document.getElementById('popoverAvatarInitial');
        if (pic) {
            bigImg.src = pic;
            bigImg.style.display = 'block';
            bigInitial.style.display = 'none';
            bigImg.onerror = () => {
                bigImg.style.display = 'none';
                bigInitial.style.display = 'block';

        const h = loadAlarmHistory();

            at: Date.now(),

            id: reminder.id || null

        updateHistoryBadge();

    function getFamiliarTasks() {
        const h = loadAlarmHistory();
        const counts = {};
        h.forEach(item => {
            const key = normalizeTaskText(item.task);
            if (!key) return;
            if (!counts[key]) counts[key] = { task: item.task, count: 0, lastAt: 0 };
            counts[key].count++;
            counts[key].lastAt = Math.max(counts[key].lastAt, item.at || 0);
        });
        return Object.values(counts)
            .filter(c => c.count >= 2)
            .sort((a, b) => b.count - a.count || b.lastAt - a.lastAt)
            .slice(0, 5);
    }

    let isSoundEnabled = false;
    const UNLOCK_EVENTS = ['click', 'touchend', 'pointerup', 'keydown'];
    const lockedQueue = [];

    function unlockSound() {
        if (isSoundEnabled) return;
        currentAudioObj.muted = true;
        currentAudioObj.play().then(() => {

    function reminderAudioUrl(reminder) {
        if (voiceMode !== 'special' || !reminder || typeof reminder !== 'object' ||
            reminder.audioStatus !== 'READY' || !reminder.audioS3Key) return null;
        return AUDIO_BASE_URL + String(reminder.audioS3Key).split('/').map(s => encodeURIComponent(s)).join('/');
    }

    const audioQueue = [];
    let queuePlaying = false;

    function enqueueReminderAudio(reminders) {
        if (!isSoundEnabled) {
            lockedQueue.push(...reminders);
            const b = document.getElementById('soundBanner');
            if (b) { b.classList.remove('hidden'); b.textContent = '🔊 Reminder fired! Tap here to hear it'; }
            try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch (e) {}
            return;
        }
        audioQueue.push(...reminders);
        if (!queuePlaying) playNextInQueue();
    }

    function playNextInQueue() {
        const reminder = audioQueue.shift();
        if (!reminder) { queuePlaying = false; return; }
        queuePlaying = true;
        const el = currentAudioObj;
        const ttsUrl = reminderAudioUrl(reminder);
        let stage = ttsUrl ? 'tts' : 'bell';
        const failed = {};
        const next = () => { el.onended = null; el.onerror = null; playNextInQueue(); };
        const start = url => {
            el.src = url; el.currentTime = 0; el.volume = 0.8;
            el.play().catch(fail);
        };
        function fail(err) {
            if (failed[stage]) return;
            failed[stage] = true;
            console.error('Audio failed (' + stage + '):', err);
            if (stage === 'tts') { stage = 'bell'; start(pickBellUrl()); }
            else { next(); }
        }
        el.onended = next;
        el.onerror = fail;
        start(ttsUrl || pickBellUrl());
    }

                headers: await authHeaders(),

                signal: controller.signal

            const data = await res.json();
            const loadingMsg = document.getElementById(tid);

            if (res.status === 401) {
                writeAuth(null);
                renderAuthUI();
                appendLoginPrompt(data.message || "Your login's expired, mate. Log in again.");
            } else if (data.needs_confirm && data.pending_id) {
                appendConfirm(data.message || "Keep this tab open, yeah?", data.pending_id);
            } else if (data.login_required) {
                appendLoginPrompt(data.message || "Log in with Google for more, mate.");
            } else {
                appendMessage(data.message || "Righto!", 'bot');
            }
        } catch (e) {
            const loadingMsg = document.getElementById(tid);
            if (loadingMsg) loadingMsg.remove();
            appendMessage(
                e && e.name === 'AbortError'
                    ? "Server's slow as, mate. It might've saved, so check before ya retry!"
                    : "Bloody hell, error!",
                'bot'
            );
        } finally {
            clearTimeout(timer);
        }
    }

    /* ============================================================
       POLLING
       ============================================================ */
    let checking = false;
    const recentlyFired = new Map();

    function isDuplicate(reminder) {
        const key = reminder.id || ('task:' + normalizeTaskText(reminder.task));
        const now = Date.now();
        for (const [k, v] of recentlyFired) {
            if (now - v > DEDUPE_TTL) recentlyFired.delete(k);
        }
        if (recentlyFired.has(key) && now - recentlyFired.get(key) < DEDUPE_TTL) return true;
        recentlyFired.set(key, now);
        return false;
    }

    function normalizeReminder(r) {
        if (typeof r === 'string') {
            return { task: r, id: null, recurrence: null, audioStatus: 'LEGACY' };
        }
        return {
            task: r.task || r.Task || r.message || r.text || r.title || r.content || '',
            id: r.id || r.reminder_id || r.reminderId || null,
            recurrence: r.recurrence || r.repeat || r.rrule || null,
            audioStatus: r.audioStatus || 'LEGACY',
            audioS3Key: r.audioS3Key || null
        };
    }

    async function autoCheck() {
        if (checking) return;
        checking = true;
        try {
            const res = await fetch(CHECK_URL + '?userId=' + encodeURIComponent(USER_ID), {
                cache: 'no-store',
                headers: await authHeaders()
            });
            if (res.status === 401) { writeAuth(null); renderAuthUI(); return; }
            if (!res.ok) return;
            const data = await res.json();
            const raw = data.reminders || [];
            const reminders = raw.map(normalizeReminder);

            const fresh = reminders.filter(r => !isDuplicate(r));
            if (fresh.length === 0) return;

            enqueueReminderAudio(fresh);
            flashAlarm();
            flashClock();

            fresh.forEach(reminder => {
                appendAlarmCard(reminder, Date.now(), true);
                recordAlarmFired(reminder);
                if (document.hidden) showSystemNotification(reminder);
            });

            if (document.hidden) document.title = '🚨 Reminder!';
        } catch (e) {
            console.error(e);
        } finally {
            checking = false;
        }
    }

    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
            document.title = ORIGINAL_TITLE;
            autoCheck();
        }
    });

    setInterval(autoCheck, POLL_MS);

        const card = document.createElement('div');

        task.className = 'alarm-task';
        task.textContent = reminder.task || 'Reminder';

        const time = document.createElement('div');
        time.className = 'alarm-time';
        const d = new Date(when);
        time.textContent = 'fired · ' + d.toLocaleTimeString('en-AU', { hour12: false });

        card.appendChild(label);
        card.appendChild(task);
        card.appendChild(time);

        if (reminder.id) {
            const actions = document.createElement('div');
            actions.className = 'alarm-actions';
            const b1 = document.createElement('button');
            b1.type = 'button';
            b1.className = 'alarm-action-btn';
            b1.textContent = 'Cancel this';
            b1.addEventListener('click', () => handleCancelOne(b1, reminder));
            const b2 = document.createElement('button');
            b2.type = 'button';
            b2.className = 'alarm-action-btn';
            b2.textContent = 'Cancel all future';
            b2.addEventListener('click', () => handleCancelAll(b2, reminder));
            actions.appendChild(b1);
            actions.appendChild(b2);
            card.appendChild(actions);
        }

        row.appendChild(card);
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
        lastMessageAt = when;

        if (save) saveHistory(null, 'remind-alert', when, { reminder });
        return row;
    }

    function appendMessage(txt, side, id, save = true, typing = false, at = null) {
        if (side === 'remind-alert') {
            const reminder = { task: (txt || '').replace(/^🚨\s*OI\s*OI\s*OI!\s*/i, '') };
            return appendAlarmCard(reminder, at || Date.now(), save);
        }

        const when = at || Date.now();
        const now = new Date(when);

        const row = document.createElement('div');
        row.className = 'row ' + side;
        if (id) row.id = id;

        if (side === 'bot') {
            const spark = document.createElement('div');
            spark.className = 'spark';
            const im = document.createElement('img');
            im.src = ROO_IMG;
            im.alt = 'DeMinh DeRozan';
            im.onerror = () => { spark.innerHTML = SPARK_SVG; };
            spark.appendChild(im);
            row.appendChild(spark);
        }

        const d = document.createElement('div');
        d.className = 'msg ' + side;
        if (typing) {
            d.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
        } else {
            d.innerText = txt;
        }

        const t = document.createElement('div');
        t.className = 'msg-time';
        t.textContent = fmtHM(now);

        const stack = document.createElement('div');
        stack.style.display = 'flex';
        stack.style.flexDirection = 'column';
        stack.appendChild(d);
        stack.appendChild(t);
        row.appendChild(stack);

        chatBox.appendChild(row);

        if (!typing) applyGapAndAge(row, when, false);

        chatBox.scrollTop = chatBox.scrollHeight;
        if (save) saveHistory(txt, side, when);
        return row;
    }

    userInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') handleSend();
    });

    function updateScrollBtn() {
        const gap = chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight;
        scrollBottom.classList.toggle('show', gap > 300);
    }
    chatBox.addEventListener('scroll', updateScrollBtn);
    scrollBottom.addEventListener('click', () => {
        chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
    });
    updateScrollBtn();

    /* Lightbox */
    (function () {
        const lb = document.getElementById('lb');
        const lbImg = document.getElementById('lbImg');
        document.querySelectorAll('.logo img').forEach(i => { i.src = ROO_IMG; });
        function openLb() { lbImg.src = ROO_IMG; lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false'); }
        function closeLb() { lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); }
        document.addEventListener('click', e => {
            if (e.target.closest('.logo, .spark')) openLb();
        });
        lb.addEventListener('click', e => { if (e.target !== lbImg) closeLb(); });
        document.getElementById('lbClose').addEventListener('click', closeLb);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
    })();
</script>
</body>
</html>
