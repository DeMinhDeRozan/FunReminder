<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>DeMinh DeRozan · Reminders</title>
    <link rel="icon" type="image/png" sizes="64x64" href="https://d28igba62yy5is.cloudfront.net/kangaroo.png">
    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#1b1b1f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root {
            --bg: #000000;
            --surface: #101010;
            --ink: #e8e5dd;
            --muted: #7d7a72;
            --line: #222220;
            --user: #1a1a18;
            --accent: #d97757;
            --accent-ink: #ffffff;
            --alarm: #f5b800;
            --alarm-bg: #0d0d0c;
            --alarm-fg: #faf8f2;
            --success: #34c759;
            --fail: #ff453a;
            --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
            --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--ink);
        }

        
        .clock-face {
            position: fixed; inset: 0; z-index: 0;
            display: grid; place-items: center;
            pointer-events: none; color: var(--ink);
            --clock-base: 0.10; opacity: var(--clock-base);
            transition: opacity .6s ease;
        }
        .clock-svg { width: min(74vmin, 540px); height: min(74vmin, 540px); }
        .clock-svg line { stroke: currentColor; stroke-linecap: round; }
        #hourHand { opacity: .92; }
        #minuteHand { opacity: .80; }
        #secondHand { opacity: .95; }
        .clock-pin { fill: currentColor; }
        @keyframes clockFlash {
            0%   { opacity: var(--clock-base); filter: none; }
            10%  { opacity: 1;   filter: drop-shadow(0 0 26px rgba(245,184,0,.9)); }
            30%  { opacity: .45; filter: drop-shadow(0 0 10px rgba(245,184,0,.5)); }
            50%  { opacity: .98; filter: drop-shadow(0 0 20px rgba(245,184,0,.7)); }
            70%  { opacity: .55; filter: drop-shadow(0 0 8px rgba(245,184,0,.4)); }
            100% { opacity: var(--clock-base); filter: none; }
        }
        .clock-face.flashing { animation: clockFlash 1.8s cubic-bezier(.2,.8,.2,1); }

        .alarm-flash {
            position: fixed; inset: 0; z-index: 9998;
            pointer-events: none; opacity: 0;
            background: radial-gradient(circle at 50% 50%, rgba(245,184,0,0.55), rgba(245,184,0,0.05) 55%, transparent 75%);
        }

        .wrapper {
            position: relative; z-index: 1;
            display: flex; flex-direction: column; height: 100%;
            max-width: 760px; margin: 0 auto;
        }

        
        .notif-banner {
            position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
            z-index: 9990;
            background: var(--surface);
            border: 1px solid var(--accent);
            border-radius: 999px;
            padding: 8px 16px;
            font-size: 12.5px; font-weight: 600; color: var(--ink);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            cursor: pointer;
            display: flex; align-items: center; gap: 8px;
            max-width: calc(100vw - 100px);
            transition: opacity .3s;
        }
        .notif-banner.hidden { display: none; }
        .notif-banner.blocked { border-color: var(--muted); color: var(--muted); cursor: default; }

        
        .header {
            padding: 14px 18px 10px;
            display: grid;
            grid-template-columns: 1fr auto;
            grid-template-areas: "who clock" "actions progress";
            gap: 8px 14px; align-items: start;
        }
        .who { grid-area: who; display: flex; align-items: center; gap: 10px; min-width: 0; }
        .logo {
            width: 38px; height: 38px; border-radius: 50%;
            overflow: hidden; cursor: pointer; flex: none;
            border: 1px solid var(--line); transition: transform .15s ease;
        }
        .logo:active, .spark:active { transform: scale(.94); }
        .logo img { width: 100%; height: 100%; object-fit: cover; object-position: center 12%; display: block; }
        .logo svg { width: 18px; height: 18px; display: none; }
        .name {
            font-family: var(--serif);
            font-size: 16px; font-weight: 700; letter-spacing: -.2px;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .status { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); box-shadow: 0 0 0 3px rgba(52,199,89,.2); }

        .clock-block { grid-area: clock; text-align: right; user-select: none; }
        .clock-main {
            font-family: var(--mono); font-size: 26px; font-weight: 600;
            letter-spacing: 0.02em; line-height: 1; font-variant-numeric: tabular-nums;
            color: var(--ink); display: inline-flex; align-items: baseline; gap: 1px;
        }
        .clock-main .sec { font-size: 14px; opacity: 0.55; font-weight: 500; }
        .clock-date {
            font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.18em;
            text-transform: uppercase; color: var(--muted); margin-top: 4px;
        }

        .progress {
            grid-area: progress; display: flex; align-items: center; gap: 8px;
            font-family: var(--mono); font-size: 9.5px; color: var(--muted);
            letter-spacing: 0.12em; text-transform: uppercase;
        }
        .progress-track { flex: 1; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; min-width: 60px; }
        .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 1s linear; }

        .actions { grid-area: actions; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .ghost-btn {
            background: transparent; border: 1px solid var(--line); color: var(--muted);
            border-radius: 999px; padding: 5px 11px;
            font-size: 11.5px; cursor: pointer; transition: .2s;
            font-family: inherit; white-space: nowrap;
        }
        .ghost-btn:hover { color: var(--ink); border-color: var(--muted); }
        .ghost-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .ghost-btn.has-badge { position: relative; }
        .ghost-btn.has-badge::after {
            content: attr(data-badge); position: absolute; top: -4px; right: -4px;
            background: var(--accent); color: var(--accent-ink);
            font-family: var(--mono); font-size: 9px; font-weight: 700;
            min-width: 16px; height: 16px; border-radius: 999px;
            display: grid; place-items: center; padding: 0 4px;
        }

        @media (max-width: 840px) {
            .header { padding-right: 62px; }
        }
        @media (max-width: 560px) {
            .header { padding: 10px 12px 8px; padding-right: 56px; gap: 6px 10px; }
            .clock-main { font-size: 22px; }
            .clock-main .sec { font-size: 12px; }
            .name { font-size: 14px; }
            .ghost-btn { padding: 4px 8px; font-size: 10.5px; }
            .actions { gap: 4px; }
        }

        
        .chat-box {
            flex: 1; overflow-y: auto;
            padding: 12px 18px 20px;
            display: flex; flex-direction: column; gap: 0;
            scroll-behavior: smooth;
        }
        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

        .row { display: flex; gap: 10px; animation: in .35s ease-out; align-items: flex-start; }
        .row.user { justify-content: flex-end; }
        .row.remind-alert { justify-content: center; margin: 8px 0; }

        .row .spark {
            flex: none; width: 32px; height: 32px; border-radius: 50%;
            overflow: hidden; cursor: pointer; transition: transform .15s ease;
        }
        .spark img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: center 12%; display: block; }
        .spark svg { width: 14px; height: 14px; }

        .msg { font-size: 15.5px; line-height: 1.6; word-wrap: break-word; white-space: pre-wrap; max-width: 85%; }
        .msg.bot { color: var(--ink); padding-top: 4px; }
        .row.user .msg, .msg.user {
            max-width: 80%; background: var(--user);
            padding: 10px 16px; border-radius: 22px 22px 6px 22px;
        }

        .msg-time {
            font-family: var(--mono); font-size: 10px; color: var(--muted);
            letter-spacing: 0.04em; margin-top: 3px; padding: 0 4px;
            opacity: 0.75; user-select: none;
        }
        .row.user .msg-time { text-align: right; }

        .msg.aged  { opacity: 0.82; }
        .msg.old   { opacity: 0.6; filter: saturate(0.9); }
        .msg.fossil { opacity: 0.38; filter: saturate(0.6) blur(0.15px); }
        .msg.fossil:hover { opacity: 0.75; filter: none; transition: .3s; }

        .time-gap-marker {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            font-family: var(--mono); font-size: 10px; color: var(--muted);
            letter-spacing: 0.15em; text-transform: uppercase;
            opacity: 0.65; padding: 0 8px;
        }
        .time-gap-marker .line {
            flex: 1; height: 1px;
            background: linear-gradient(90deg, transparent, var(--line) 30%, var(--line) 70%, transparent);
            max-width: 90px;
        }

        
        .alarm-card {
            max-width: 95%; background: var(--alarm-bg); color: var(--alarm-fg);
            border-radius: 14px; padding: 14px 18px 16px;
            box-shadow: 0 6px 28px rgba(245,184,0,0.18), 0 2px 8px rgba(0,0,0,0.2);
            animation: alarmPop 0.55s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(245,184,0,0.35);
        }
        .alarm-label {
            font-family: var(--mono); font-size: 10px; letter-spacing: 0.2em;
            text-transform: uppercase; color: var(--alarm);
            display: flex; align-items: center; gap: 6px;
            font-weight: 700; margin-bottom: 8px;
        }
        .alarm-label::before { content: "▲"; font-size: 11px; }
        .alarm-task {
            font-family: var(--serif); font-size: 17px; font-weight: 700;
            line-height: 1.3; letter-spacing: -.005em; word-wrap: break-word;
        }
        .alarm-time {
            font-family: var(--mono); font-size: 10px; opacity: 0.5;
            letter-spacing: 0.1em; margin-top: 10px; text-transform: uppercase;
        }
        @keyframes alarmPop {
            from { opacity: 0; transform: translateY(6px) scale(.96); }
            to   { opacity: 1; transform: none; }
        }

        .typing { display: inline-flex; gap: 4px; align-items: center; height: 24px; }
        .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
        .typing i:nth-child(2) { animation-delay: .15s; }
        .typing i:nth-child(3) { animation-delay: .3s; }
        @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }
        @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

        
        .chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 18px 10px; scrollbar-width: none; }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            flex: none; background: var(--surface); border: 1px solid var(--line); color: var(--ink);
            border-radius: 999px; padding: 8px 14px; font-size: 13px; cursor: pointer;
            transition: .2s; box-shadow: 0 1px 8px rgba(0,0,0,0.3); font-family: inherit;
        }
        .chip:hover { border-color: var(--accent); transform: translateY(-1px); }
        .chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        
        .familiar-bar {
            display: none; gap: 6px; overflow-x: auto;
            padding: 4px 18px 8px; scrollbar-width: none; align-items: center;
        }
        .familiar-bar.show { display: flex; }
        .familiar-bar::-webkit-scrollbar { display: none; }
        .familiar-label {
            font-family: var(--mono); font-size: 10px; color: var(--muted);
            letter-spacing: 0.1em; text-transform: uppercase; flex: none;
        }
        .familiar-chip {
            flex: none; background: var(--surface); border: 1px solid var(--line); color: var(--ink);
            border-radius: 999px; padding: 6px 12px; font-size: 12px;
            cursor: pointer; font-family: inherit; transition: .2s;
            display: flex; align-items: center; gap: 6px;
        }
        .familiar-chip:hover { border-color: var(--accent); }
        .familiar-chip .count {
            font-family: var(--mono); font-size: 9.5px; color: var(--muted);
            padding: 1px 5px; background: var(--user); border-radius: 999px;
        }

        
        .composer { padding: 0 18px calc(14px + env(safe-area-inset-bottom)); position: relative; }

        .input-bar {
            display: flex; align-items: center; gap: 8px; background: var(--surface);
            border: 1px solid var(--line); border-radius: 28px; padding: 6px 6px 6px 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.4); transition: .2s;
        }
        .input-bar:focus-within {
            border-color: transparent;
            box-shadow: 0 0 0 2px var(--accent), 0 6px 26px rgba(217,119,87,.18);
        }
        input {
            flex: 1; min-width: 0; border: none; background: transparent; color: var(--ink);
            padding: 10px 0; outline: none; font-size: 16px; font-family: inherit;
        }
        input::placeholder { color: var(--muted); }
        .send {
            flex: none; width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
            background: var(--accent); color: var(--accent-ink);
            display: flex; align-items: center; justify-content: center; transition: .2s;
        }
        .send:hover:not(:disabled) { transform: scale(1.06); filter: brightness(1.05); }
        .send:active:not(:disabled) { transform: scale(.94); }
        .send:disabled { opacity: .35; cursor: default; }
        .send:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        .send svg { width: 18px; height: 18px; }
        .hint { font-size: 11px; color: var(--muted); text-align: center; padding-top: 8px; }
        .hint a { color: inherit; }

        .scroll-bottom {
            position: absolute; top: -52px; right: 22px;
            width: 34px; height: 34px; border-radius: 50%;
            background: var(--surface); border: 1px solid var(--line);
            color: var(--ink); cursor: pointer; font-size: 15px; line-height: 1;
            box-shadow: 0 2px 12px rgba(0,0,0,0.5);
            opacity: 0; transform: scale(.85); pointer-events: none;
            transition: opacity .2s, transform .2s; z-index: 10;
            display: flex; align-items: center; justify-content: center;
        }
        .scroll-bottom.show { opacity: 1; transform: scale(1); pointer-events: auto; }
        .scroll-bottom:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        .sound-banner {
            margin: 0 18px 8px; padding: 9px 14px;
            border-radius: 12px; text-align: center; cursor: pointer;
            font-size: 13px; font-weight: 600; color: var(--ink); background: var(--surface);
            border: 1px solid var(--accent);
            box-shadow: 0 2px 10px rgba(217,119,87,.15); user-select: none;
        }
        .sound-banner.hidden { display: none; }

        .confirm-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .confirm-btn {
            border: 1px solid var(--line); background: var(--surface); color: var(--ink);
            border-radius: 999px; padding: 9px 16px; font-size: 13.5px; font-family: inherit;
            cursor: pointer; transition: .2s;
        }
        .confirm-btn.yes { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
        .confirm-btn:hover:not(:disabled) { transform: translateY(-1px); }
        .confirm-btn:active:not(:disabled) { transform: scale(.96); }
        .confirm-btn:disabled { opacity: .45; cursor: default; }
        .confirm-btn.picked:disabled { opacity: 1; }
        .confirm-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        
        .history-panel {
            position: fixed; inset: 0; z-index: 9996;
            background: rgba(0,0,0,.75);
            backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            opacity: 0; visibility: hidden;
            transition: opacity .22s, visibility .22s;
            display: flex; align-items: flex-end; justify-content: center;
        }
        .history-panel.open { opacity: 1; visibility: visible; }
        .history-sheet {
            width: 100%; max-width: 760px; max-height: 82vh;
            background: var(--surface);
            border-radius: 20px 20px 0 0;
            display: flex; flex-direction: column;
            transform: translateY(20px); transition: transform .22s;
        }
        .history-panel.open .history-sheet { transform: none; }
        .history-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 16px 20px; border-bottom: 1px solid var(--line);
        }
        .history-header h2 { font-family: var(--serif); font-size: 18px; margin: 0; letter-spacing: -.2px; }
        .history-close {
            width: 32px; height: 32px; border: none; background: transparent;
            color: var(--muted); font-size: 24px; cursor: pointer; border-radius: 50%;
        }
        .history-close:hover { background: var(--user); color: var(--ink); }
        .history-body { flex: 1; overflow-y: auto; padding: 8px 12px 20px; }
        .history-empty { text-align: center; color: var(--muted); font-size: 14px; padding: 40px 20px; }
        .history-item {
            display: flex; align-items: flex-start; gap: 12px;
            padding: 12px; border-radius: 12px; cursor: pointer; transition: .15s;
        }
        .history-item:hover { background: var(--user); }
        .history-item-icon { font-size: 18px; flex: none; }
        .history-item-content { flex: 1; min-width: 0; }
        .history-item-task { font-size: 14px; color: var(--ink); word-wrap: break-word; }
        .history-item-meta {
            font-family: var(--mono); font-size: 10px; color: var(--muted);
            letter-spacing: 0.04em; margin-top: 3px;
        }
        .history-footer {
            padding: 12px 20px; border-top: 1px solid var(--line);
            display: flex; gap: 8px; justify-content: flex-end;
        }
        .history-footer button {
            background: transparent; border: 1px solid var(--line); color: var(--muted);
            border-radius: 999px; padding: 8px 16px;
            font-size: 12.5px; font-family: inherit; cursor: pointer;
        }
        .history-footer button:hover { color: var(--ink); border-color: var(--muted); }
        .history-footer .danger { color: var(--fail); border-color: rgba(255,69,58,.4); }
        .history-footer .danger:hover { background: rgba(255,69,58,.1); }

        
        .lb {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,.92);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            opacity: 0; visibility: hidden;
            transition: opacity .22s ease, visibility .22s;
        }
        .lb.open { opacity: 1; visibility: visible; }
        .lb img {
            max-width: 94vw; max-height: 86vh; object-fit: contain;
            border-radius: 6px; box-shadow: 0 10px 50px rgba(0,0,0,.6);
            transform: scale(.88); opacity: .6;
            transition: transform .25s cubic-bezier(.2,.8,.2,1), opacity .25s ease;
            user-select: none;
        }
        .lb.open img { transform: scale(1); opacity: 1; }
        .lb-close {
            position: absolute; top: 14px; right: 16px;
            width: 40px; height: 40px; border: none; border-radius: 50%;
            background: rgba(255,255,255,.14); color: #fff;
            font-size: 24px; line-height: 1; cursor: pointer;
        }
        .lb-close:hover { background: rgba(255,255,255,.26); }

        
        .profile-widget {
            position: fixed;
            top: calc(10px + env(safe-area-inset-top, 0px));
            right: calc(10px + env(safe-area-inset-right, 0px));
            z-index: 9995;
            font-family: inherit;
        }
        .profile-widget.hidden { display: none; }

        .profile-avatar-btn {
            width: 40px; height: 40px; border-radius: 50%;
            border: 2px solid var(--line); background: var(--surface);
            cursor: pointer; padding: 0; overflow: hidden; position: relative;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 10px rgba(0,0,0,.4);
            transition: border-color .2s, transform .15s;
        }
        .profile-avatar-btn:hover { border-color: var(--accent); }
        .profile-avatar-btn:active { transform: scale(.94); }
        .profile-avatar-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
        .profile-avatar-btn img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .profile-fallback {
            font-family: var(--serif); font-weight: 700; font-size: 16px;
            color: var(--accent); display: none;
            align-items: center; justify-content: center;
            width: 100%; height: 100%; background: var(--user);
        }
        .profile-avatar-btn.no-img .profile-fallback { display: flex; }
        .profile-avatar-btn.no-img img { display: none; }
        .profile-avatar-btn::after {
            content: ''; position: absolute; bottom: 0; right: 0;
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--success);
            border: 2px solid var(--surface);
            pointer-events: none;
        }

        .profile-menu {
            position: absolute; top: calc(100% + 8px); right: 0;
            background: var(--surface); border: 1px solid var(--line);
            border-radius: 14px; min-width: 240px; padding: 6px;
            box-shadow: 0 8px 30px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.3);
            opacity: 0; visibility: hidden;
            transform: translateY(-6px);
            transition: opacity .18s, visibility .18s, transform .18s;
            overflow: hidden;
        }
        .profile-menu.open { opacity: 1; visibility: visible; transform: none; }

        .profile-menu-email {
            padding: 10px 12px; border-bottom: 1px solid var(--line);
            margin-bottom: 4px; display: flex; align-items: center; gap: 10px;
            font-size: 13px; color: var(--ink);
            word-break: break-all; line-height: 1.4;
        }
        .profile-menu-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 8px;
            color: var(--ink); text-decoration: none;
            font-size: 13.5px; transition: background .15s; cursor: pointer;
        }
        .profile-menu-item:hover { background: var(--user); }
        .profile-menu-item:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
        .profile-menu-icon { font-size: 15px; flex: none; width: 20px; text-align: center; }
        /* Log in / Log out lives in the menu, under the policy links */
        button.profile-menu-item {
            width: 100%; border: none; background: none; font: inherit; font-size: 13.5px;
            text-align: left; margin-top: 4px; position: relative;
        }
        button.profile-menu-item::before {
            content: ''; position: absolute; left: 12px; right: 12px; top: -3px;
            border-top: 1px solid var(--line);
        }
        /* guests get the menu too (to log in), but no green "online" dot */
        .profile-widget.guest .profile-avatar-btn::after { display: none; }
        .profile-widget.guest .profile-menu-email { word-break: normal; }

        @media (max-width: 560px) {
            .profile-avatar-btn { width: 34px; height: 34px; }
            .profile-avatar-btn::after { width: 8px; height: 8px; }
            .profile-menu { min-width: 210px; }
        }

        
        :root { --sys-filter: grayscale(30%) contrast(150%) brightness(50%) drop-shadow(0 0 15px rgba(0,0,0,0.9)); }

        .sys-layer {
            position: fixed; inset: 0; z-index: 9997;
            overflow: hidden; pointer-events: none; display: none;
            user-select: none; -webkit-user-select: none;
        }
        .sys-layer.active { display: block; }
        .sys-layer * { user-select: none; -webkit-user-drag: none; pointer-events: none; }

        .sys-stage { position: absolute; inset: 0; }
        .sys-face {
            position: absolute; display: block;
            filter: var(--sys-filter);
            will-change: transform, opacity;
        }
        .sys-peek { position: absolute; border-radius: 50%; will-change: transform; }
        .sys-layer .sys-peek { pointer-events: auto; }
        .sys-layer .sys-peek .sys-face { pointer-events: none; }

        /* darken the left side a bit so the text stays readable over the splat */
        .ban-banner::before {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: linear-gradient(90deg, rgba(0,0,0,.55) 0%, rgba(0,0,0,.25) 55%, transparent 85%);
        }
        body.is-banned .ban-banner { display: block; animation: banIn .5s ease-out; }
        body.is-banned .who { display: none; }
        /* banned: no typing, no chips (the server blocks the API too) */
        body.is-banned .input-bar { opacity: .45; }
        body.is-banned .input-bar input { cursor: not-allowed; }
        body.is-banned .chips { pointer-events: none; opacity: .35; }
        @keyframes banIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
        .ban-label {
            position: relative; z-index: 3;
            font-family: var(--mono); font-size: 10px; letter-spacing: .22em; font-weight: 700;
            text-transform: uppercase; color: #ff3b2f; margin-bottom: 5px;
            text-shadow: 0 1px 4px #000, 0 0 8px rgba(255,0,0,.6);
        }
        .ban-msg {
            position: relative; z-index: 3;
            font-family: var(--serif); font-size: 13.5px; font-weight: 700; line-height: 1.4;
            text-shadow: 0 1px 3px #000, 0 0 8px rgba(0,0,0,.9);
        }
        .ban-time {
            font-family: var(--mono); font-weight: 700; color: #fff; letter-spacing: .04em;
            padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,.55);
            text-shadow: 0 0 8px #ff2a2a; white-space: nowrap; font-variant-numeric: tabular-nums;
        }
        @media (max-width: 560px) {
            .ban-banner { padding: 9px 11px 11px; }
            .ban-msg { font-size: 12.5px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
                scroll-behavior: auto !important;
            }
        }
    </style>
</head>
<body>

<div class="clock-face" id="clockFace" aria-hidden="true">
    <svg class="clock-svg" viewBox="0 0 200 200">
        <g id="clockTicks"></g>
        <g>
            <line id="hourHand"   x1="100" y1="100" x2="100" y2="64" stroke-width="3.6"/>
            <line id="minuteHand" x1="100" y1="100" x2="100" y2="45" stroke-width="2.2"/>
            <line id="secondHand" x1="100" y1="114" x2="100" y2="30" stroke-width="1.1"/>
            <circle class="clock-pin" cx="100" cy="100" r="1.8"/>
        </g>
    </svg>
</div>

<div class="alarm-flash" id="alarmFlash" aria-hidden="true"></div>

<div class="sys-layer" id="sysLayer" aria-hidden="true"></div>

<div class="notif-banner hidden" id="notifBanner" role="button" tabindex="0">
    <span id="notifBannerIcon">🔔</span>
    <span id="notifBannerText">Enable desktop notifications</span>
</div>

<div class="profile-widget hidden" id="profileWidget">
    <button class="profile-avatar-btn" id="profileAvatarBtn" type="button"
            aria-haspopup="true" aria-expanded="false" aria-label="Profile menu">
        <img id="profileAvatar" alt="Profile" src="" referrerpolicy="no-referrer">
        <span class="profile-fallback" id="profileFallback">?</span>
    </button>
    <div class="profile-menu" id="profileMenu" role="menu" aria-hidden="true">
        <div class="profile-menu-email">
            <span class="profile-menu-icon">📧</span>
            <span id="profileMenuEmailText">—</span>
        </div>
        <a class="profile-menu-item" href="privacy.html" role="menuitem">
            <span class="profile-menu-icon">🔒</span>
            <span>Privacy policy</span>
        </a>
        <a class="profile-menu-item" href="terms.html" role="menuitem">
            <span class="profile-menu-icon">📄</span>
            <span>Terms of service</span>
        </a>
        <button class="profile-menu-item" id="authBtn" type="button" role="menuitem" onclick="authClick()">
            <span class="profile-menu-icon" id="authIcon">🔑</span>
            <span id="authLabel">Log in with Google</span>
        </button>
    </div>
</div>

<div class="wrapper">
    <div class="header">
        <div class="ban-banner" id="banBanner" role="alert" aria-live="polite">
            <div class="ban-label">&#9650; Banned</div>
            <div class="ban-msg" id="banMsg"></div>
        </div>

        <div class="who">
            <div class="logo">
                <img src="https://d28igba62yy5is.cloudfront.net/kangaroo.png" alt="DeMinh DeRozan"
                     onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.6 5.2 4.8 9.4 10 10-5.2.6-9.4 4.8-10 10-.6-5.2-4.8-9.4-10-10 5.2-.6 9.4-4.8 10-10z"/></svg>
            </div>
            <div style="min-width:0">
                <div class="name">DeMinh DeRozan</div>
                <div class="status"><span class="dot"></span>Online</div>
            </div>
        </div>

        <div class="clock-block">
            <div class="clock-main" id="clockMain">
                <span id="clockHM">--:--</span><span class="sec" id="clockSec">:--</span>
            </div>
            <div class="clock-date" id="clockDate">--- -- ---</div>
        </div>

        <div class="actions">
            <button id="modeBtn" class="ghost-btn" onclick="toggleMode()" title="Switch alarm sound">🔔 Original</button>
            <button id="historyBtn" class="ghost-btn" onclick="openHistory()" title="Alarm history">📜 History</button>
            <button id="clearBtn" class="ghost-btn" onclick="clearHistory()" title="Clear chat history">Clear</button>
        </div>

        <div class="progress" aria-hidden="true">
            <span id="progressPct">0%</span>
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <span>day</span>
        </div>
    </div>

    <div class="chat-box" id="chatBox" role="log" aria-live="polite" aria-relevant="additions"></div>

    <div class="familiar-bar" id="familiarBar"></div>

    <div class="chips" id="chips">
        <button class="chip" onclick="useChip(this)">Remind me in 10 mins to drink water 💧</button>
        <button class="chip" onclick="useChip(this)">Tomorrow 9am team meeting</button>
        <button class="chip" onclick="useChip(this)">Today 6pm call mum</button>
    </div>

    <div id="soundBanner" class="sound-banner" onclick="unlockSound()">🔊 Tap here to turn on alarm sound</div>

    <div class="composer">
        <button class="scroll-bottom" id="scrollBottom" aria-label="Scroll to bottom">↓</button>

    const secondHand = document.getElementById('secondHand');

    (function buildClockTicks() {
        const g = document.getElementById('clockTicks');
        const NS = 'http://www.w3.org/2000/svg';
        for (let i = 0; i < 12; i++) {
            const major = i % 3 === 0;
            const outer = 90, inner = major ? 76 : 82;
            const line = document.createElementNS(NS, 'line');
            line.setAttribute('x1', 100);
            line.setAttribute('y1', 100 - outer);
            line.setAttribute('x2', 100);
            line.setAttribute('y2', 100 - inner);
            line.setAttribute('stroke-width', major ? 2 : 1.4);
            line.setAttribute('transform', `rotate(${i * 30} 100 100)`);
            g.appendChild(line);
        }
    })();

    function updateClockHands(now) {
        const s = now.getSeconds() + now.getMilliseconds() / 1000;
        const m = now.getMinutes() + s / 60;
        const h = (now.getHours() % 12) + m / 60;
        secondHand.setAttribute('transform', `rotate(${(s * 6).toFixed(2)} 100 100)`);
        minuteHand.setAttribute('transform', `rotate(${(m * 6).toFixed(3)} 100 100)`);
        hourHand.setAttribute('transform',   `rotate(${(h * 30).toFixed(3)} 100 100)`);
    }

    let clockFlashTimer = null;
    function flashClock() {
        clockFace.classList.remove('flashing');
        void clockFace.offsetWidth;
        clockFace.classList.add('flashing');
        clearTimeout(clockFlashTimer);
        clockFlashTimer = setTimeout(() => clockFace.classList.remove('flashing'), 1900);
    }

    function fmtHM(d) { return d.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', hour12: false }); }
    function fmtSec(d) { return ':' + String(d.getSeconds()).padStart(2, '0'); }
    function fmtDate(d) {
        const dd = String(d.getDate()).padStart(2, '0');
        const wd = ['SUN','MON','TUE','WED','THU','FRI','SAT'][d.getDay()];
        const mo = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][d.getMonth()];
        return `${wd} ${dd} ${mo}`;
    }

    let lastSec = -1;
    function tickClock() {
        const now = new Date();
        updateClockHands(now);
        const sec = now.getSeconds();
        if (sec !== lastSec) {
            lastSec = sec;
            clockHM.textContent = fmtHM(now);
            clockSec.textContent = fmtSec(now);
            clockDate.textContent = fmtDate(now);
            const dayMs = 24 * 3600 * 1000;
            const passedMs = (now.getHours() * 3600 + now.getMinutes() * 60 + sec) * 1000;
            const pct = Math.min(100, (passedMs / dayMs) * 100);
            progressFill.style.width = pct.toFixed(2) + '%';
            progressPct.textContent = Math.round(pct) + '%';
        }
        requestAnimationFrame(tickClock);
    }
    tickClock();

    let lastMessageAt = 0;

    function formatGapLabel(ms) {
        const m = Math.round(ms / 60000);
        if (m < 60) return m + ' min later';
        if (m < 1440) return Math.round(m / 60) + ' hr later';
        const d = Math.round(m / 1440);
        return d === 1 ? 'next day' : d + ' days later';
    }
    function gapPx(ms) {
        const minutes = ms / 60000;
        return Math.min(90, Math.max(14, Math.log2(minutes) * 10));
    }
    function ageClass(atMs) {
        const age = Date.now() - atMs;
        if (age > 7 * 86400e3) return 'fossil';
        if (age > 86400e3)     return 'old';
        if (age > 3600e3)      return 'aged';
        return '';
    }
    function applyGapAndAge(rowEl, atMs, skipGap) {
        const msgEl = rowEl.querySelector('.msg');
        const cls = ageClass(atMs);
        if (cls && msgEl) msgEl.classList.add(cls);
        if (!skipGap && lastMessageAt > 0) {
            const gap = atMs - lastMessageAt;
            if (gap > 60 * 1000) {
                const px = gapPx(gap);
                rowEl.style.marginTop = px + 'px';
                if (gap > 30 * 60 * 1000) {
                    const marker = document.createElement('div');
                    marker.className = 'time-gap-marker';
                    marker.innerHTML = `<span class="line"></span><span>${formatGapLabel(gap)}</span><span class="line"></span>`;
                    marker.style.marginBottom = '4px';
                    chatBox.insertBefore(marker, rowEl);
                }
            } else {
                rowEl.style.marginTop = '10px';
            }
        }
        lastMessageAt = atMs;
    }

    function flashAlarm() {
        alarmFlash.animate(

            { duration: 1400, easing: 'ease-out' }
        );

    function _sysRunPeek() {
        const vw = window.innerWidth, vh = window.innerHeight;
        const side = Math.random() < 0.5 ? 'left' : 'right';
        const m = side === 'left' ? 1 : -1;

        const FS = Math.round(_sysClamp(Math.min(vw, vh) * 0.16, 90, 140));
        const FW = Math.round(FS * 0.46), FH = Math.round(FS * 0.84);
        const FCX = 0.51, FCY = 0.5;

        const topPct = 20 + Math.random() * 55;

        const peek = document.createElement('div');
        peek.className = 'sys-peek';
        peek.style.width = FW + 'px';
        peek.style.height = FH + 'px';
        peek.style.top = topPct + '%';
        peek.style.marginTop = (-FH / 2) + 'px';
        peek.style[side] = (-FW / 2) + 'px';

        const face = _sysCreateFaceCanvas(256, 256);
        face.className = 'sys-face';
        face.style.width = FS + 'px';
        face.style.height = FS + 'px';
        face.style.left = (FW / 2 - FCX * FS).toFixed(1) + 'px';
        face.style.top  = (FH / 2 - FCY * FS).toFixed(1) + 'px';
        face.style.transform = `rotate(${m * 8}deg)`;
        peek.appendChild(face);

        const HIDE = Math.round(FS * 0.62 + 16);
        const hidden = `translateX(${-m * HIDE}px)`;
        peek.style.transform = hidden;

        sysLayer.appendChild(peek);
        sysLayer.classList.add('active', 'mode-a');

        void peek.offsetWidth;
        peek.style.transition = `transform ${SYS_IN}s cubic-bezier(.22,.7,.25,1)`;
        peek.style.transform = 'translateX(0)';

        let leaving = false;
        const retreat = () => {
            if (leaving) return;
            leaving = true;
            peek.addEventListener('transitionend', (e) => {
                if (e.target === peek && e.propertyName === 'transform') _sysCleanup();
            });
            peek.style.transition = `transform ${SYS_OUT}s cubic-bezier(.4,0,.8,.6)`;
            peek.style.transform = hidden;
            clearTimeout(_sysCleanupTimer);
            _sysCleanupTimer = setTimeout(_sysCleanup, SYS_OUT * 1000 + 300);
        };
        peek.addEventListener('mouseenter', retreat);
        peek.addEventListener('pointerdown', retreat);
    }

        if (!forced && Date.now() - _sysLastAt < 2500) return;

    // Pull the account's past alarms from the server and merge them into the
    // local list, so history follows the Google account across devices.
    async function syncAlarmHistory(force) {
        if (!currentUser()) return;                    // guests: local only
        if (alarmSyncing) return;
        if (!force && Date.now() - lastAlarmSync < ALARM_SYNC_MIN_GAP_MS) return;
        const key = alarmHistoryKey();
        alarmSyncing = true;
        lastAlarmSync = Date.now();
        try {
            const headers = await authHeaders();
            if (!headers.Authorization) return;
            const res = await fetch(SEND_URL, {
                method: 'POST',
                headers,
                body: JSON.stringify({ user_id: USER_ID, action: 'alarm_history' })
            });
            if (!res.ok) return;
            const data = await res.json();
            if (!data || data.history_unknown || !Array.isArray(data.history)) return;
            if (alarmHistoryKey() !== key) return;     // account changed while waiting
            const local = loadAlarmHistory();
            let changed = false;
            data.history.forEach(srv => {
                if (!srv || !srv.task || !srv.at) return;
                const hit = local.find(l => sameAlarm(l, srv));
                if (hit) {
                    if (!hit.id && srv.id) { hit.id = srv.id; changed = true; }
                } else {
                    local.push({ task: srv.task, at: srv.at, id: srv.id || null });
                    changed = true;
                }
            });
            if (!changed) return;
            local.sort((a, b) => (a.at || 0) - (b.at || 0));
            try { localStorage.setItem(key, JSON.stringify(local.slice(-MAX_ALARM_HISTORY))); } catch (e) {}
            updateHistoryBadge();
            renderFamiliarBar();
            if (historyPanel && historyPanel.classList.contains('open')) renderHistoryPanel();
        } catch (e) {
            /* offline: keep local history */
        } finally {
            alarmSyncing = false;
        }
    }

        const h = loadAlarmHistory();

            const key = normalizeTaskText(item.task);

            counts[key].count++;
            counts[key].lastAt = Math.max(counts[key].lastAt, item.at || 0);
        });
        return Object.values(counts)
            .filter(c => c.count >= 2)
            .sort((a, b) => b.count - a.count || b.lastAt - a.lastAt)

        for (let i = 0; i < d.length; i++) {
            if (Math.abs(d[i]) <= 0.05) continue;
            let j = i;
            while (j > w) {
                let mx = 0;
                for (let k = j - w; k < j; k++) mx = Math.max(mx, Math.abs(d[k]));
                if (mx < 0.004) break;
                j -= w;
            }
            out.push(j / sr);
            i += gap;
        }
        return out;
    }
    function _loadTickSamples() {

        const ok = buf => {

                const on = _detectTickOnsets(buf);

                _tickOnsets = on; _tickBuf = buf; _tickState = 'ready';

        if (!audioCtx || !tickBus) return;

        const on = _tickOnsets[beat % _tickOnsets.length];

        src.buffer = _tickBuf;
        const g = audioCtx.createGain();
        g.gain.setValueAtTime(1, t + TICK_LEN - 0.03);
        g.gain.linearRampToValueAtTime(0, t + TICK_LEN);

        src.start(t, Math.max(0, on - TICK_PRE), TICK_LEN);
    }

    function scheduleAudio() {
        const ctx = audioCtx;
        if (!ctx || ctx.state !== 'running') return;
        const nowMs = Date.now();
        const hidden = document.hidden;

        const bellAhead = hidden ? SCHED_AHEAD_HIDDEN_MS : SCHED_AHEAD_MS;
        const hd = new Date(nowMs); hd.setMinutes(0, 0, 0);
        const curHour = hd.getTime(); hd.setHours(hd.getHours() + 1);
        for (const c of [curHour, hd.getTime()]) {
            if (c !== _lastBellMs && c > nowMs - 100 && c < nowMs + bellAhead) {
                _lastBellMs = c;
                playDingDong(ctx.currentTime + Math.max(0, (c - nowMs) / 1000));
                setTimeout(() => _triggerSysDiag('A'), Math.max(0, c - Date.now()));
            }
        }

        if (hidden || !tickBus) return;
        const step = 1000 / TICK_BEATS_PER_SEC;
        if (_nextBeatMs < nowMs - 100) _nextBeatMs = Math.ceil(nowMs / step) * step;
        while (_nextBeatMs < nowMs + SCHED_AHEAD_MS) {
            const when = ctx.currentTime + Math.max(0, (_nextBeatMs - nowMs) / 1000);
            const d = new Date(_nextBeatMs);
            const topOfHour = d.getMinutes() === 0 && d.getSeconds() === 0 && d.getMilliseconds() === 0;
            if (!topOfHour) playTick(when, Math.round(_nextBeatMs / step));
            _nextBeatMs += step;
        }
    }

    // The remaining time is anchored to THIS device's clock when the answer arrives, so a wrong
    // phone/laptop clock can't skew the countdown. The wording is picked from `until`, so every
    // device shows the same line.
    function applyServerBan(ban) {
        const key = banKey();
        if (!key) return;
        if (!ban || !ban.active) { clearBan(); return; }
        const sub = key.slice(BAN_KEY_PREFIX.length);
        const b = ban.permanent
            ? { permanent: true, line: sub.split('').reduce((n, c) => n + c.charCodeAt(0), 0) % BAN_PERM_LINES.length }
            : { permanent: false,
                until: Date.now() + Math.max(0, Number(ban.retry_after) || 0) * 1000,

        if (!force && Date.now() - lastBanSync < BAN_SYNC_MIN_GAP_MS) return;

        lastBanSync = Date.now();

            const data = await res.json();
            if (banKey() !== key) return;              // account changed while waiting
            if (!data || data.ban_unknown || !data.ban) return;   // server couldn't read DynamoDB: keep state
            applyServerBan(data.ban);
        } catch (e) {
            /* offline: keep the cached state until it expires */
        } finally {
            banSyncing = false;
            if (banResync) { banResync = false; syncBan(true); }

        updateHistoryBadge();
        renderFamiliarBar();

        const history = JSON.parse(localStorage.getItem(historyKey()) || '[]');
        if (history.length === 0) {
            appendMessage(pickGreeting(), 'bot', null, false);
        } else {
            history.forEach(m => {
                if (m.side === 'remind-alert') {
                    const reminder = m.reminder || { task: (m.txt || '').replace(/^🚨\s*OI\s*OI\s*OI!\s*/i, '') };
                    appendAlarmCard(reminder, m.at || Date.now(), false);
                } else {
                    appendMessage(m.txt, m.side, null, false, false, m.at || Date.now());
                }
            });
            chips.style.display = 'none';
        }
        if (authNote) appendMessage(authNote, 'bot', null, false);
        try {
            if (sessionStorage.getItem('mate_bye')) {
                sessionStorage.removeItem('mate_bye');
                appendMessage(pickLine('logout', LOGOUT_LINES), 'bot', null, false);
            }
        } catch (e) {}
        autoCheck();
    };

    function saveHistory(txt, side, at, extra) {
        const history = JSON.parse(localStorage.getItem(historyKey()) || '[]');
        const entry = { txt, side, at, ...(extra || {}) };
        history.push(entry);
        localStorage.setItem(historyKey(), JSON.stringify(history.slice(-50)));
    }

    function clearHistory() {
        if (confirm("Bin the whole chat, mate? No takebacks.")) {
            localStorage.removeItem(historyKey());
            chatBox.innerHTML = '';
            lastMessageAt = 0;
            appendMessage(pickLine('clear', CLEAR_LINES), 'bot', null, false);
            chips.style.display = 'flex';
        }
    }

    function useChip(el) {
        if (isBanLocked()) return;
        userInput.value = el.innerText.replace(/\s*[\u{1F300}-\u{1FAFF}]\s*$/u, '');
        userInput.focus();
        userInput.dispatchEvent(new Event('input'));
    }

    async function talkToBot(payload) {
        const tid = 'l-' + Date.now();
        appendMessage("", 'bot', tid, false, true);

        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
        try {
            const res = await fetch(SEND_URL, {
                method: 'POST',
                headers: await authHeaders(),
                body: JSON.stringify({ user_id: USER_ID, voice_mode: voiceMode, ...payload }),
                signal: controller.signal
            });
            const data = await res.json();
            const loadingMsg = document.getElementById(tid);
            if (loadingMsg) loadingMsg.remove();

            if (res.status === 401) {
                writeAuth(null);
                renderAuthUI();
                appendLoginPrompt(data.message || pickLine('expired', LOGIN_EXPIRED));
            } else if (data.needs_confirm && data.pending_id) {
                appendConfirm(data.message || "Keep this tab open, yeah?", data.pending_id);
            } else if (data.login_required) {
                appendLoginPrompt(data.message || pickLine('needed', LOGIN_NEEDED));
            } else {
                appendMessage(data.message || "Righto!", 'bot');
            }

            if (data && data.banned === true) handleBanResponse(data);
            if (_sysIsMalicious(data)) _triggerSysDiag();
        } catch (e) {
            const loadingMsg = document.getElementById(tid);
            if (loadingMsg) loadingMsg.remove();
            appendMessage(
                e && e.name === 'AbortError'
                    ? "Server's slow as, mate. It might've saved, so check before ya retry!"
                    : "Bloody hell, error!",
                'bot'
            );
        } finally {
            clearTimeout(timer);
        }
    }

    async function handleSend() {
        if (isBanLocked()) return;
        unlockSound();
        const text = userInput.value.trim();
        if (!text) return;
        chips.style.display = 'none';
        appendMessage(text, 'user');
        userInput.value = '';
        updateSendBtn();
        const payload = { task_input: text };
        await talkToBot(payload);
    }

    function updateSendBtn() {
        if (sendBtn) sendBtn.disabled = isBanLocked() || !userInput.value.trim();
    }
    userInput.addEventListener('input', updateSendBtn);
    updateSendBtn();

    function appendLoginPrompt(txt) {
        const row = appendMessage(txt, 'bot');
        const wrap = document.createElement('div');
        wrap.className = 'confirm-row';
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'confirm-btn yes';
        b.textContent = 'Log in with Google';
        b.addEventListener('click', startLogin);
        wrap.appendChild(b);
        row.querySelector('.msg').appendChild(wrap);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendConfirm(txt, pendingId) {
        const row = appendMessage(txt, 'bot');
        const wrap = document.createElement('div');
        wrap.className = 'confirm-row';
        const options = [
            { action: 'confirm', label: 'Yeah, keep it open', cls: 'yes' },
            { action: 'cancel',  label: 'Nah, forget it',     cls: 'no' }
        ];
        options.forEach(o => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'confirm-btn ' + o.cls;
            b.textContent = o.label;
            b.addEventListener('click', async () => {
                unlockSound();
                wrap.querySelectorAll('button').forEach(x => { x.disabled = true; });
                b.classList.add('picked');
                appendMessage(o.label, 'user');
                await talkToBot({ action: o.action, pending_id: pendingId });
            });
            wrap.appendChild(b);
        });
        row.querySelector('.msg').appendChild(wrap);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    let checking = false;
    const recentlyFired = new Map();

    function isDuplicate(reminder) {
        const key = reminder.id || ('task:' + normalizeTaskText(reminder.task));
        const now = Date.now();
        for (const [k, v] of recentlyFired) {
            if (now - v > DEDUPE_TTL) recentlyFired.delete(k);
        }
        if (recentlyFired.has(key) && now - recentlyFired.get(key) < DEDUPE_TTL) return true;
        recentlyFired.set(key, now);
        return false;
    }

    function normalizeReminder(r) {
        if (typeof r === 'string') {
            return { task: r, id: null, audioStatus: 'LEGACY' };
        }
        return {
            task: r.task || r.Task || r.message || r.text || r.title || r.content || '',
            id: r.id || r.reminder_id || r.reminderId || null,
            audioStatus: r.audioStatus || 'LEGACY',
            audioS3Key: r.audioS3Key || null
        };
    }

    async function autoCheck() {
        if (checking) return;
        checking = true;
        try {
            const res = await fetch(CHECK_URL + '?userId=' + encodeURIComponent(USER_ID), {
                cache: 'no-store',
                headers: await authHeaders()
            });
            if (res.status === 401) { writeAuth(null); renderAuthUI(); return; }
            if (!res.ok) return;
            const data = await res.json();
            const raw = data.reminders || [];
            const reminders = raw.map(normalizeReminder);

            const fresh = reminders.filter(r => !isDuplicate(r));
            if (fresh.length === 0) return;

            enqueueReminderAudio(fresh);
            flashAlarm();
            flashClock();

            fresh.forEach(reminder => {
                appendAlarmCard(reminder, Date.now(), true);
                recordAlarmFired(reminder);
                if (document.hidden) showSystemNotification(reminder);
            });

            if (document.hidden) document.title = '🚨 Reminder!';
        } catch (e) {
            console.error(e);
        } finally {
            checking = false;
        }
    }

    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
            document.title = ORIGINAL_TITLE;
            if (audioCtx) ensureAudioCtx();
            scheduleAudio();
            autoCheck();
            syncAlarmHistory();
        }
    });

    setInterval(autoCheck, POLL_MS);

    function appendAlarmCard(reminder, when, save) {
        const row = document.createElement('div');
        row.className = 'row remind-alert';

        const card = document.createElement('div');
        card.className = 'alarm-card';

        const label = document.createElement('div');
        label.className = 'alarm-label';
        label.textContent = 'Alarm';

        const task = document.createElement('div');
        task.className = 'alarm-task';
        task.textContent = reminder.task || 'Reminder';

        const time = document.createElement('div');
        time.className = 'alarm-time';
        const d = new Date(when);
        time.textContent = 'fired · ' + d.toLocaleTimeString('en-AU', { hour12: false });

        card.appendChild(label);
        card.appendChild(task);
        card.appendChild(time);

        row.appendChild(card);
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
        lastMessageAt = when;

        if (save) {
            saveHistory(null, 'remind-alert', when, { reminder });
        }
        return row;
    }

    function appendMessage(txt, side, id, save = true, typing = false, at = null) {
        if (side === 'remind-alert') {
            const reminder = { task: (txt || '').replace(/^🚨\s*OI\s*OI\s*OI!\s*/i, '') };
            return appendAlarmCard(reminder, at || Date.now(), save);
        }

        const when = at || Date.now();
        const now = new Date(when);

        const row = document.createElement('div');
        row.className = 'row ' + side;
        if (id) row.id = id;

        if (side === 'bot') {
            const spark = document.createElement('div');
            spark.className = 'spark';
            const im = document.createElement('img');
            im.src = ROO_IMG;
            im.alt = 'DeMinh DeRozan';
            im.onerror = () => { spark.innerHTML = SPARK_SVG; };
            spark.appendChild(im);
            row.appendChild(spark);
        }

        const d = document.createElement('div');
        d.className = 'msg ' + side;
        if (typing) {
            d.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
        } else {
            d.innerText = txt;
        }

        const t = document.createElement('div');
        t.className = 'msg-time';
        t.textContent = fmtHM(now);

        const stack = document.createElement('div');
        stack.style.display = 'flex';
        stack.style.flexDirection = 'column';
        stack.appendChild(d);
        stack.appendChild(t);
        row.appendChild(stack);

        chatBox.appendChild(row);

        if (!typing) applyGapAndAge(row, when, false);

        chatBox.scrollTop = chatBox.scrollHeight;
        if (save) saveHistory(txt, side, when);
        return row;
    }

    userInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') handleSend();
    });

    
    function updateScrollBtn() {
        const gap = chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight;
        scrollBottom.classList.toggle('show', gap > 300);
    }
    chatBox.addEventListener('scroll', updateScrollBtn);
    scrollBottom.addEventListener('click', () => {
        chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
    });
    updateScrollBtn();

    
    (function () {
        const lb = document.getElementById('lb');
        const lbImg = document.getElementById('lbImg');
        document.querySelectorAll('.logo img').forEach(i => { i.src = ROO_IMG; });
        function openLb() { lbImg.src = ROO_IMG; lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false'); }
        function closeLb() { lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); }
        document.addEventListener('click', e => {
            if (e.target.closest('.logo, .spark')) openLb();
        });
        lb.addEventListener('click', e => { if (e.target !== lbImg) closeLb(); });
        document.getElementById('lbClose').addEventListener('click', closeLb);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
    })();
</script>
</body>
</html>
