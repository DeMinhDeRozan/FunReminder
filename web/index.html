<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Aussie Reminder</title>
    <link rel="icon" type="image/png" sizes="64x64" href="https://d28igba62yy5is.cloudfront.net/kangaroo.png">
    <style>
        /* Hybrid: Claude (warm cream, serif, terracotta) + GPT (clean column, pill composer)
           + Gemini (gradient sparkle, soft glow, suggestion chips) */
        :root {
            --bg: #faf9f5;
            --surface: #ffffff;
            --ink: #1f1e1d;
            --muted: #85827a;
            --line: #e8e5dc;
            --user: #efece3;
            --accent: #d97757;
            --accent-ink: #ffffff;
            --alert-a: #ff5f6d;
            --alert-b: #ffa24c;
            --gem: linear-gradient(120deg, #4285f4 0%, #9b72cb 50%, #d96570 100%);
            --shadow: 0 2px 18px rgba(60, 50, 30, 0.08);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #262624;
                --surface: #30302e;
                --ink: #ece9e1;
                --muted: #9a978e;
                --line: #3d3c39;
                --user: #3a3936;
                --shadow: 0 2px 18px rgba(0, 0, 0, 0.35);
            }
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--ink);
        }
        /* soft Gemini-style glow behind everything */
        body::before {
            content: ""; position: fixed; inset: -20% -10% auto -10%; height: 55%;
            background:
                radial-gradient(40% 60% at 25% 20%, rgba(66,133,244,.14), transparent 70%),
                radial-gradient(40% 60% at 70% 10%, rgba(217,101,112,.13), transparent 70%),
                radial-gradient(35% 55% at 50% 30%, rgba(155,114,203,.12), transparent 70%);
            pointer-events: none; z-index: 0;
        }
        .wrapper {
            position: relative; z-index: 1;
            display: flex; flex-direction: column; height: 100%;
            max-width: 760px; margin: 0 auto;
        }

        /* Header */
        .header {
            padding: 14px 18px; display: flex; align-items: center; justify-content: space-between;
            backdrop-filter: blur(8px);
        }
        .who { display: flex; align-items: center; gap: 12px; }
        .logo {
            width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            background: transparent; padding: 0; box-shadow: none; overflow: hidden; cursor: pointer;
            transition: transform .15s ease;
        }
        .logo:active, .spark:active { transform: scale(.94); }
        .logo img {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: center 12%;
            background: transparent; display: block;
        }
        .logo svg { width: 20px; height: 20px; display: none; }
        .name { font-family: Georgia, "Times New Roman", serif; font-size: 18px; font-weight: 600; letter-spacing: -.2px; }
        .status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; margin-top: 1px; }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: #34c759; box-shadow: 0 0 0 3px rgba(52,199,89,.2); }
        .ghost-btn {
            background: transparent; border: 1px solid var(--line); color: var(--muted);
            border-radius: 999px; padding: 6px 12px; font-size: 12px; cursor: pointer; transition: .2s;
        }
        .actions { display: flex; gap: 8px; align-items: center; }
        .ghost-btn:hover { color: var(--ink); border-color: var(--muted); }

        /* Chat */
        .chat-box {
            flex: 1; overflow-y: auto; padding: 8px 18px 20px;
            display: flex; flex-direction: column; gap: 18px; scroll-behavior: smooth;
        }
        .chat-box::-webkit-scrollbar { width: 6px; }
        .chat-box::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
        .row { display: flex; gap: 12px; animation: in .35s ease-out; }
        .row.user { justify-content: flex-end; }
        .row.remind-alert { justify-content: center; }
        .spark {
            flex: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            background: transparent; padding: 0; overflow: hidden; margin-top: 0; cursor: pointer;
            transition: transform .15s ease;
        }
        .spark img {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover; object-position: center 12%;
            background: transparent; display: block;
        }
        /* Lightbox */
        .lb {
            position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center;
            background: rgba(0,0,0,.88); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            opacity: 0; visibility: hidden; transition: opacity .22s ease, visibility .22s;
        }
        .lb.open { opacity: 1; visibility: visible; }
        .lb img {
            max-width: 94vw; max-height: 86vh; object-fit: contain; border-radius: 6px;
            box-shadow: 0 10px 50px rgba(0,0,0,.6); transform: scale(.88); opacity: .6;
            transition: transform .25s cubic-bezier(.2,.8,.2,1), opacity .25s ease; user-select: none;
        }
        .lb.open img { transform: scale(1); opacity: 1; }
        .lb-close {
            position: absolute; top: 14px; right: 16px; width: 40px; height: 40px; border: none; border-radius: 50%;
            background: rgba(255,255,255,.14); color: #fff; font-size: 24px; line-height: 1; cursor: pointer;
        }
        .lb-close:hover { background: rgba(255,255,255,.26); }
        .spark svg { width: 15px; height: 15px; }
        .msg { font-size: 15.5px; line-height: 1.6; word-wrap: break-word; white-space: pre-wrap; }
        .bot { max-width: 85%; color: var(--ink); padding-top: 3px; }
        .user .msg, .msg.user {
            max-width: 80%; background: var(--user); padding: 10px 16px; border-radius: 22px 22px 6px 22px;
        }
        .msg.remind-alert {
            max-width: 92%; text-align: center; font-weight: 700; letter-spacing: .3px; color: #fff;
            padding: 14px 20px; border-radius: 18px;
            background: linear-gradient(120deg, var(--alert-a), var(--alert-b));
            box-shadow: 0 8px 28px rgba(255,95,109,.35);
            animation: pop .45s cubic-bezier(.175,.885,.32,1.275);
        }
        .typing { display: inline-flex; gap: 4px; align-items: center; height: 24px; }
        .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bounce 1.2s infinite; }
        .typing i:nth-child(2) { animation-delay: .15s; }
        .typing i:nth-child(3) { animation-delay: .3s; }
        @keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity: .4; } 30% { transform: translateY(-5px); opacity: 1; } }
        @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
        @keyframes pop { from { opacity: 0; transform: scale(.85); } to { opacity: 1; transform: scale(1); } }

        /* Suggestion chips (Gemini) */
        .chips { display: flex; gap: 8px; overflow-x: auto; padding: 0 18px 10px; scrollbar-width: none; }
        .chips::-webkit-scrollbar { display: none; }
        .chip {
            flex: none; background: var(--surface); border: 1px solid var(--line); color: var(--ink);
            border-radius: 999px; padding: 8px 14px; font-size: 13px; cursor: pointer; transition: .2s;
            box-shadow: var(--shadow);
        }
        .chip:hover { border-color: var(--accent); transform: translateY(-1px); }

        /* Composer (GPT pill + Claude warmth) */
        .composer { padding: 0 18px calc(14px + env(safe-area-inset-bottom)); }
        .input-bar {
            display: flex; align-items: center; gap: 8px; background: var(--surface);
            border: 1px solid var(--line); border-radius: 28px; padding: 6px 6px 6px 20px;
            box-shadow: var(--shadow); transition: .2s;
        }
        .input-bar:focus-within {
            border-color: transparent;
            box-shadow: 0 0 0 2px var(--accent), 0 6px 26px rgba(217,119,87,.2);
        }
        input {
            flex: 1; border: none; background: transparent; color: var(--ink);
            padding: 10px 0; outline: none; font-size: 16px; font-family: inherit;
        }
        input::placeholder { color: var(--muted); }
        .send {
            flex: none; width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer;
            background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center;
            transition: .2s;
        }
        .send:hover { transform: scale(1.06); filter: brightness(1.05); }
        .send:active { transform: scale(.94); }
        .send svg { width: 18px; height: 18px; }
        .hint { font-size: 11.5px; color: var(--muted); text-align: center; padding-top: 8px; }
    </style>
</head>
<body>
<div class="wrapper">
    <div class="header">
        <div class="who">
            <div class="logo">
                <img src="" alt="Roo" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.6 5.2 4.8 9.4 10 10-5.2.6-9.4 4.8-10 10-.6-5.2-4.8-9.4-10-10 5.2-.6 9.4-4.8 10-10z"/></svg>
            </div>
            <div>
                <div class="name">DeMinh DeRozan</div>
                <div class="status"><span class="dot"></span>Online</div>
            </div>
        </div>
        <div class="actions">
            <button id="modeBtn" class="ghost-btn" onclick="toggleMode()" title="Switch alarm sound">🔔 Original</button>
            <button id="clearBtn" class="ghost-btn" onclick="clearHistory()">Clear chat</button>
        </div>
    </div>

    <div class="chat-box" id="chatBox"></div>

    <div class="chips" id="chips">
        <button class="chip" onclick="useChip(this)">Remind me in 10 mins to drink water 💧</button>
        <button class="chip" onclick="useChip(this)">Tomorrow 9am team meeting</button>
        <button class="chip" onclick="useChip(this)">Today 6pm call mum</button>
    </div>

    <div class="composer">
        <div class="input-bar">
            <input type="text" id="userInput" placeholder="Type here, ya legend..." autocomplete="off">
            <button class="send" onclick="handleSend()" aria-label="Send">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
        </div>
        <div class="hint">Keep this tab open to get reminded.</div>
    </div>
</div>

<div class="lb" id="lb" aria-hidden="true">
    <button class="lb-close" id="lbClose" aria-label="Close">&times;</button>
    <img id="lbImg" alt="Roo">
</div>
<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const chips = document.getElementById('chips');

    const audioList = [
        'https://d28igba62yy5is.cloudfront.net/audio.mp3',
        'https://d28igba62yy5is.cloudfront.net/audioo.mp3'
    ];

    let currentAudioObj = new Audio(audioList[0]);
    currentAudioObj.volume = 0.8;

    const SEND_URL  = "https://rpjf4296xk.execute-api.ap-southeast-2.amazonaws.com/Production/reminder";
    const CHECK_URL = "https://rpjf4296xk.execute-api.ap-southeast-2.amazonaws.com/Production/check";
    const AUDIO_BASE_URL = "https://d28igba62yy5is.cloudfront.net/";
    const FETCH_TIMEOUT_MS = 28000; // API Gateway cuts at ~29s
    const POLL_MS = 15000;
    const ORIGINAL_TITLE = document.title;

    const SPARK_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.6 5.2 4.8 9.4 10 10-5.2.6-9.4 4.8-10 10-.6-5.2-4.8-9.4-10-10 5.2-.6 9.4-4.8 10-10z"/></svg>';

    function getUserId() {
        try {
            let id = localStorage.getItem('mate_user_id');
            if (!id) {
                id = (crypto.randomUUID ? crypto.randomUUID() : 'u-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10));
                localStorage.setItem('mate_user_id', id);
            }
            return id;
        } catch (e) {
            return 'u-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
        }
    }
    const USER_ID = getUserId();

    /*  Sound  */
    let isSoundEnabled = false;
    const UNLOCK_EVENTS = ['click', 'touchstart', 'keydown'];

    function unlockSound() {
        if (isSoundEnabled) return;
        currentAudioObj.muted = true;
        currentAudioObj.play().then(() => {
            currentAudioObj.pause();
            currentAudioObj.currentTime = 0;
            currentAudioObj.muted = false;
            isSoundEnabled = true;
            UNLOCK_EVENTS.forEach(ev => document.removeEventListener(ev, unlockSound));
        }).catch(() => { currentAudioObj.muted = false; });
    }
    UNLOCK_EVENTS.forEach(ev => document.addEventListener(ev, unlockSound));

    function pickBellUrl() {
        return audioList[Math.floor(Math.random() * audioList.length)];
    }

    /* Alarm mode: 'original' = the two bell mp3s, 'special' = generated M1/M2/M5 voice */
    let voiceMode = 'special';
    try {
        const saved = localStorage.getItem('mate_voice_mode');
        if (saved === 'original' || saved === 'special') voiceMode = saved;
    } catch (e) {}

    function renderModeBtn() {
        const b = document.getElementById('modeBtn');
        if (b) b.textContent = voiceMode === 'special' ? '🎙️ Special' : '🔔 Original';
    }

    function toggleMode() {
        voiceMode = voiceMode === 'special' ? 'original' : 'special';
        try { localStorage.setItem('mate_voice_mode', voiceMode); } catch (e) {}
        renderModeBtn();
        appendMessage(
            voiceMode === 'special'
                ? "Special mode on, mate! Ya'll get the proper voice 🎙️"
                : "Original mode on! Back to the good old bell 🔔",
            'bot', null, false
        );
    }
    renderModeBtn();

    /* Build the CloudFront URL for a generated TTS file, or null if there isn't one */
    function reminderAudioUrl(reminder) {
        if (
            voiceMode !== 'special' ||
            !reminder ||
            typeof reminder !== 'object' ||
            reminder.audioStatus !== 'READY' ||
            !reminder.audioS3Key
        ) {
            return null;
        }

        const key = String(reminder.audioS3Key)
            .split('/')
            .map(segment => encodeURIComponent(segment))
            .join('/');

        return AUDIO_BASE_URL + key;
    }

    /*
     * Play each fired reminder one after another on the SAME audio element that
     * was unlocked by the user's first tap (iOS/Safari only allow that one).
     * Order of preference: Supertonic voice -> old bell. Any load/play error
     * (404, expired by the S3 lifecycle rule, etc.) falls back to the bell.
     */
    const audioQueue = [];
    let queuePlaying = false;

    function enqueueReminderAudio(reminders) {
        if (!isSoundEnabled) {
            console.warn('Audio is not unlocked yet by a user interaction.');
            return;
        }

        audioQueue.push(...reminders);
        if (!queuePlaying) playNextInQueue();
    }

    function playNextInQueue() {
        const reminder = audioQueue.shift();

        if (!reminder) {
            queuePlaying = false;
            return;
        }

        queuePlaying = true;

        const el = currentAudioObj;
        const ttsUrl = reminderAudioUrl(reminder);
        let stage = ttsUrl ? 'tts' : 'bell';
        const failed = {};

        const next = () => {
            el.onended = null;
            el.onerror = null;
            playNextInQueue();
        };

        const start = url => {
            el.src = url;
            el.currentTime = 0;
            el.volume = 0.8;
            el.play().catch(fail);
        };

        // Called for play() rejection AND the element's error event; once per stage.
        function fail(err) {
            if (failed[stage]) return;
            failed[stage] = true;
            console.error('Audio failed (' + stage + '):', err);

            if (stage === 'tts') {
                stage = 'bell';
                start(pickBellUrl());
            } else {
                next();
            }
        }

        el.onended = next;
        el.onerror = fail;

        start(ttsUrl || pickBellUrl());
    }

    function playBell() {
        if (!isSoundEnabled) return;
        enqueueReminderAudio([{ audioStatus: 'LEGACY' }]);
    }

    /* Chat history */
    window.onload = () => {
        const history = JSON.parse(localStorage.getItem('mate_chat_history') || '[]');
        if (history.length === 0) {
            appendMessage("Scarnon? Put a task in and I'll remind ya! ✨", 'bot', null, false);
        } else {
            history.forEach(m => appendMessage(m.txt, m.side, null, false));
            chips.style.display = 'none';
        }
        autoCheck();
    };

    function saveHistory(txt, side) {
        const history = JSON.parse(localStorage.getItem('mate_chat_history') || '[]');
        history.push({ txt, side });
        localStorage.setItem('mate_chat_history', JSON.stringify(history.slice(-50)));
    }

    function clearHistory() {
        if (confirm("Delete all chat history?")) {
            localStorage.removeItem('mate_chat_history');
            chatBox.innerHTML = '';
            appendMessage("History cleared, mate!", 'bot', null, false);
            chips.style.display = 'flex';
        }
    }

    function useChip(el) {
        userInput.value = el.innerText.replace(/\s*[\u{1F300}-\u{1FAFF}]\s*$/u, '');
        userInput.focus();
    }

    /* Send */
    async function handleSend() {
        unlockSound();

        const text = userInput.value.trim();
        if (!text) return;

        chips.style.display = 'none';
        appendMessage(text, 'user');
        userInput.value = '';

        const tid = 'l-' + Date.now();
        appendMessage("", 'bot', tid, false, true);

        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);

        try {
            const res = await fetch(SEND_URL, {
                method: 'POST',
                body: JSON.stringify({ user_id: USER_ID, task_input: text, voice_mode: voiceMode }),
                signal: controller.signal
            });
            const data = await res.json();
            const loadingMsg = document.getElementById(tid);
            if (loadingMsg) loadingMsg.remove();
            appendMessage(data.message || "Righto!", 'bot');
        } catch (e) {
            const loadingMsg = document.getElementById(tid);
            if (loadingMsg) loadingMsg.remove();
            appendMessage(
                e && e.name === 'AbortError'
                    ? "Server's slow as, mate. It might've saved, so check before ya retry!"
                    : "Bloody hell, error!",
                'bot'
            );
        } finally {
            clearTimeout(timer);
        }
    }

    function taskToText(v) {
        if (v == null) return '';
        if (typeof v === 'string') return v;
        if (Array.isArray(v)) return v.map(taskToText).join(' ');
        if (typeof v === 'object') {
            for (const k of ['S', 'task', 'Task', 'text', 'message', 'title', 'content']) {
                if (k in v) return taskToText(v[k]);
            }
            return JSON.stringify(v);
        }
        return String(v);
    }

    /* Polling */
    let checking = false;

    async function autoCheck() {
        if (checking) return;
        checking = true;
        try {
            const res = await fetch(CHECK_URL + '?userId=' + encodeURIComponent(USER_ID), { cache: 'no-store' });
            if (!res.ok) return;
            const data = await res.json();
            const list = data.reminders || [];
            if (list.length > 0) {
                // Old API returned plain strings, new one returns objects.
                const reminders = list.map(r =>
                    typeof r === 'string'
                        ? { task: r, audioStatus: 'LEGACY' }
                        : r
                );

                enqueueReminderAudio(reminders);

                reminders.forEach(r => appendMessage(
                    "🚨 OI OI OI! " + (taskToText(r.task) || 'Reminder').toUpperCase(),
                    'remind-alert'
                ));

                if (document.hidden) document.title = "🚨 Reminder!";
            }
        } catch (e) {
            console.error(e);
        } finally {
            checking = false;
        }
    }

    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
            document.title = ORIGINAL_TITLE;
            autoCheck();
        }

    /* UI */
    function appendMessage(txt, side, id, save = true, typing = false) {
        const row = document.createElement('div');
        row.className = 'row ' + side;
        if (id) row.id = id;

        if (side === 'bot') {
            const spark = document.createElement('div');
            spark.className = 'spark';
            const im = document.createElement('img');
            im.src = ROO_IMG;
            im.alt = 'Roo';
            im.onerror = () => { spark.innerHTML = SPARK_SVG; };
            spark.appendChild(im);
            row.appendChild(spark);
        }

        const d = document.createElement('div');
        d.className = 'msg ' + side;
        if (typing) {
            d.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
        } else {
            d.innerText = txt;
        }
        row.appendChild(d);

        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
        if (save) saveHistory(txt, side);
    }

    userInput.addEventListener("keydown", e => {
        if (e.key === "Enter") handleSend();
    });

    /* Avatar viewer (lightbox) */
    (function () {
        const lb = document.getElementById('lb');
        const lbImg = document.getElementById('lbImg');
        document.querySelectorAll('.logo img').forEach(i => i.src = ROO_IMG);
        function openLb() { lbImg.src = ROO_IMG; lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false'); }
        function closeLb() { lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); }
        document.addEventListener('click', e => {
            if (e.target.closest('.logo, .spark')) openLb();
        });
        lb.addEventListener('click', e => { if (e.target !== lbImg) closeLb(); });
        document.getElementById('lbClose').addEventListener('click', closeLb);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
    })();
</script>
