        canvas.height = height;
        const ctx = canvas.getContext('2d');
        const base = _sysBuildFaceBase();
        if (base) {
            ctx.imageSmoothingQuality = 'high';
            ctx.drawImage(base, 0, 0, width, height);
        } else {
            _sysDrawFallbackFace(ctx, width, height);
        }
        return canvas;
    }

    function _sysIsMalicious(data) {
        return !!(data && (data.injection === true || data.banned === true));
    }

    let _sysRaf = 0;
    let _sysOnPointer = null;
    let _sysTugTimer = null;

    function _sysCleanup() {
        cancelAnimationFrame(_sysRaf);
        _sysRaf = 0;
        clearTimeout(_sysCleanupTimer);
        _sysCleanupTimer = null;
        clearTimeout(_sysTugTimer);
        if (_sysOnPointer) {
            window.removeEventListener('pointermove', _sysOnPointer);
            window.removeEventListener('pointerdown', _sysOnPointer);
            _sysOnPointer = null;
        }
        sysLayer.classList.remove('active', 'mode-a', 'mode-b');
        sysLayer.style.removeProperty('--dur');
        while (sysLayer.firstChild) sysLayer.firstChild.remove();
        const wrapper = document.querySelector('.wrapper');
        if (wrapper) wrapper.classList.remove('sys-shake', 'sys-tug');
        _sysBusy = false;
    }

    const _sysClamp = (v, a, b) => Math.min(b, Math.max(a, v));
    const _sysSmooth = (a, b, v) => { const t = _sysClamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

    /* ---------- Mode A: cánh tay bấu vào mép khung UI ---------- */
    function _sysRunPeek() {
        const NS = 'http://www.w3.org/2000/svg';
        const mk = (tag, attrs) => {
            const e = document.createElementNS(NS, tag);
            for (const k in attrs) e.setAttribute(k, attrs[k]);
            return e;
        };

        const vw = window.innerWidth, vh = window.innerHeight;
        const side = Math.random() < 0.5 ? 'left' : 'right';
        const m = side === 'left' ? 1 : -1;
        const X = x => (m === 1 ? x : vw - x);          // canonical (từ mép màn hình vào) → toạ độ màn hình

        // Điểm bấu: mép ngoài của khung chat (.wrapper). Màn nhỏ khung sát mép → bấu ở 22px.
        // Dùng mép nhìn thấy được của thanh nhập (.input-bar) làm đường biên khung; fallback .wrapper.
        const frameEl = document.querySelector('.input-bar') || document.querySelector('.wrapper');
        const wr = frameEl.getBoundingClientRect();
        const edge = side === 'left' ? wr.left : vw - wr.right;
        const gx = Math.max(edge + 2, 14);
        // 50%: bấu ngay vào thanh nhập, 50%: bấu dọc mép khung chat
        const gy = Math.random() < 0.5
            ? wr.top + wr.height / 2
            : vh * (0.28 + Math.random() * 0.4);
        const sc = _sysClamp(Math.min(vw, vh) / 700, 0.85, 1.3);
        const shoulderDy = (Math.random() < 0.5 ? -1 : 1) * (45 + Math.random() * 55) * sc;

        const stage = document.createElement('div');
        stage.className = 'sys-stage';

        // Đầu/thân ở ngoài mép màn hình, chỉ lộ một phần (SYS_FACE_VISIBLE)
        let face = null;
        const FS = Math.round(_sysClamp(vw * 0.13, 120, 190) * sc);
        if (SYS_FACE_VISIBLE > 0) {
            face = _sysCreateFaceCanvas(256, 256);
            face.className = 'sys-face';
            face.style.width = FS + 'px';
            face.style.height = FS + 'px';
            face.style.top = Math.round(gy + shoulderDy - FS * 0.5) + 'px';
            face.style.left = (m === 1 ? -FS * (1 - SYS_FACE_VISIBLE) : vw - FS * SYS_FACE_VISIBLE) + 'px';
            face.style.opacity = '0';
            stage.appendChild(face);
        }

        const svg = mk('svg', { class: 'sys-arm-svg', viewBox: `0 0 ${vw} ${vh}`, preserveAspectRatio: 'none' });
        const RIM = '#b9b4aa', FILL = '#050505';
        const armRim  = mk('path', { fill: 'none', stroke: RIM, 'stroke-width': 1.6, 'stroke-linejoin': 'round', opacity: .6 });
        const armFill = mk('path', { fill: FILL, stroke: FILL, 'stroke-width': 1, 'stroke-linejoin': 'round' });
        const palmRim  = mk('path', { fill: 'none', stroke: RIM, 'stroke-width': 1.6, 'stroke-linejoin': 'round', opacity: .6 });
        const palmFill = mk('path', { fill: FILL, stroke: FILL, 'stroke-width': 1, 'stroke-linejoin': 'round' });
        svg.append(armRim, armFill, palmRim, palmFill);

        // Ngón tay: ky = vị trí dọc lòng bàn tay, len = độ dài từng đốt, fan = độ xoè, curlMul = độ cong
        const fingerDefs = [
            { ky: -19, len: [30, 24, 18], w: [4.6, 3.4, 2.4], fan: -14, curlMul: 1.00 },
            { ky:  -7, len: [34, 27, 20], w: [4.8, 3.5, 2.4], fan:  -5, curlMul: 1.05 },
            { ky:   6, len: [33, 26, 19], w: [4.8, 3.5, 2.4], fan:   4, curlMul: 1.00 },
            { ky:  18, len: [26, 21, 16], w: [4.4, 3.2, 2.2], fan:  14, curlMul: 0.95 },
            { ky:  27, len: [19, 15],     w: [4.6, 3.2],      fan:  38, curlMul: 0.80, thumb: true }
        ];
        const fingers = fingerDefs.map(def => {
            const rim = def.len.map(() => mk('line', { stroke: RIM, 'stroke-linecap': 'round', opacity: .6 }));
            const fill = def.len.map(() => mk('line', { stroke: FILL, 'stroke-linecap': 'round' }));
            const nail = mk('line', { stroke: '#d6d1c4', 'stroke-width': 1.5, 'stroke-linecap': 'round', opacity: .85 });
            rim.forEach(e => svg.appendChild(e));
            fill.forEach(e => svg.appendChild(e));
            svg.appendChild(nail);
            return { def, rim, fill, nail };
        });
        stage.appendChild(svg);

        sysLayer.appendChild(stage);
        sysLayer.classList.add('active', 'mode-a');

        const wrapper = document.querySelector('.wrapper');
        const bb = { x0: 0, y0: 0, x1: 0, y1: 0 };
        let twitch = 0, nextTwitch = 0.15, tugged = false, last = 0;
        const t0 = performance.now();
        const TOTAL = SYS_IN + SYS_HOLD + SYS_OUT;
        let rNow = 0;

        // Rê chuột/chạm vào bàn tay hoặc mặt → biến mất ngay lập tức
        _sysOnPointer = (ev) => {
            if (rNow < 0.2) return;
            const pad = 22;
            const x = ev.clientX, y = ev.clientY;
            let hit = x >= bb.x0 - pad && x <= bb.x1 + pad && y >= bb.y0 - pad && y <= bb.y1 + pad;
            if (!hit && face) {
                const r = face.getBoundingClientRect();
                hit = x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad;
            }
            if (hit) _sysCleanup();
        };
        window.addEventListener('pointermove', _sysOnPointer, { passive: true });
        window.addEventListener('pointerdown', _sysOnPointer, { passive: true });

        function frame(now) {
            const t = (now - t0) / 1000;
            const dt = Math.min(0.05, Math.max(0.001, t - last)); last = t;
            if (t >= TOTAL) { _sysCleanup(); return; }

            let r, curl, alpha;
            if (t < SYS_IN) {
                const u = t / SYS_IN;
                r = 1 - Math.pow(1 - u, 3);
                curl = _sysSmooth(0.55, 1, u);
                alpha = Math.min(1, u * 1.6);
            } else if (t < SYS_IN + SYS_HOLD) {
                r = 1; curl = 1; alpha = 1;
            } else {
                const u = (t - SYS_IN - SYS_HOLD) / SYS_OUT;
                r = 1 - Math.pow(u, 1.5);
                curl = Math.max(0, 1 - u * 3);
                alpha = 1 - u;
            }
            rNow = r;

            if (!tugged && t >= SYS_IN * 0.85 && wrapper) {
                tugged = true;
                wrapper.style.setProperty('--tug', (m * 2.2) + 'px');
                wrapper.classList.remove('sys-tug'); void wrapper.offsetWidth; wrapper.classList.add('sys-tug');
                _sysTugTimer = setTimeout(() => wrapper.classList.remove('sys-tug'), 300);
            }

            // Giật nhẹ ngẫu nhiên
            const holding = t >= SYS_IN * 0.8 && t < SYS_IN + SYS_HOLD + 0.05;
            twitch *= Math.pow(0.0008, dt);
            if (holding && t >= nextTwitch) { twitch = 0.6 + Math.random() * 0.4; nextTwitch = t + 0.12 + Math.random() * 0.28; }
            const amp = (holding ? 1.2 : 0.6) + twitch * 5.5;

            // Vị trí tay
            const slide = -(1 - r) * (gx + 150 * sc);
            const sway = Math.sin(t * 5.2) * 2.2 * sc + Math.sin(t * 13.1) * 0.8 * sc;
            const jy = (Math.sin(t * 41) + Math.sin(t * 27.3)) * 0.5 * (0.7 + twitch * 2.2) * sc;
            const PCx = gx - 22 * sc + slide;
            const PCy = gy + sway * 0.35 + jy;

            // Cẳng tay: cubic cong lượn từ ngoài màn hình, thon dần
            const Sx = Math.min(-90, PCx - 70 * sc), Sy = gy + shoulderDy;
            const Wx = PCx - 5 * sc, Wy = PCy;
            const sag = 55 * sc * (shoulderDy > 0 ? -1 : 1);
            const c1x = Sx + (Wx - Sx) * 0.35, c1y = Sy + sag + sway;
            const c2x = Sx + (Wx - Sx) * 0.72, c2y = Wy - sag * 0.55 - sway * 0.8;
            const N = 22, L = [], R = [];
            let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
            const grow = (px, py) => {
                const sx = X(px);
                if (sx < minX) minX = sx; if (sx > maxX) maxX = sx;
                if (py < minY) minY = py; if (py > maxY) maxY = py;
            };
            for (let i = 0; i <= N; i++) {
                const u = i / N, v = 1 - u;
                const px = v*v*v*Sx + 3*v*v*u*c1x + 3*v*u*u*c2x + u*u*u*Wx;
                const py = v*v*v*Sy + 3*v*v*u*c1y + 3*v*u*u*c2y + u*u*u*Wy;
                const tx = 3*v*v*(c1x - Sx) + 6*v*u*(c2x - c1x) + 3*u*u*(Wx - c2x);
                const ty = 3*v*v*(c1y - Sy) + 6*v*u*(c2y - c1y) + 3*u*u*(Wy - c2y);
                const len = Math.hypot(tx, ty) || 1;
                const nx = -ty / len, ny = tx / len;
                const half = (12 - 6 * u + Math.sin(u * 9 + t * 3) * 0.4) * 0.5 * sc;
                L.push([px + nx * half, py + ny * half]);
                R.push([px - nx * half, py - ny * half]);
                if (i % 3 === 0) grow(px, py);
            }
            const ring = L.concat(R.reverse());
            const armD = 'M' + ring.map(q => X(q[0]).toFixed(1) + ' ' + q[1].toFixed(1)).join(' L') + ' Z';
            armRim.setAttribute('d', armD);
            armFill.setAttribute('d', armD);

            // Lòng bàn tay
            const pk = (dx, dy) => X(PCx + dx * sc).toFixed(1) + ' ' + (PCy + dy * sc).toFixed(1);
            const palmD = `M${pk(-8,-6)} L${pk(-2,-24)} Q${pk(6,-26)} ${pk(10,-22)} L${pk(13,26)} Q${pk(4,32)} ${pk(-4,20)} Z`;
            palmRim.setAttribute('d', palmD);
            palmFill.setAttribute('d', palmD);
            grow(PCx - 8 * sc, PCy - 26 * sc); grow(PCx + 13 * sc, PCy + 32 * sc);

            // Các ngón: dài ngoẵng, vắt qua mép khung rồi gập móc lại
            fingers.forEach((f, i) => {
                const d = f.def;
                const jit = (Math.sin(t * 47 + i * 1.7) + Math.sin(t * 31 + i * 2.9)) * 0.5 * amp;
                const open = (d.fan + (i % 2 ? 6 : -4) * (1 - curl)) * (1 - curl * 0.75);
                let ang = (open + jit * 0.6) * Math.PI / 180;
                let px = PCx + 9 * sc, py = PCy + d.ky * sc;
                for (let k = 0; k < d.len.length; k++) {
                    if (k > 0) ang += (curl * (k === 1 ? 52 : 40) * d.curlMul + jit * 1.2) * Math.PI / 180;
                    const ln = d.len[k] * sc * (0.94 + 0.06 * (1 - curl * 0.3));
                    const nx = px + Math.cos(ang) * ln, ny = py + Math.sin(ang) * ln;
                    const x1 = X(px).toFixed(1), x2 = X(nx).toFixed(1);
                    const wf = d.w[k] * sc;
                    f.fill[k].setAttribute('x1', x1); f.fill[k].setAttribute('y1', py.toFixed(1));
                    f.fill[k].setAttribute('x2', x2); f.fill[k].setAttribute('y2', ny.toFixed(1));
                    f.fill[k].setAttribute('stroke-width', wf.toFixed(2));
                    f.rim[k].setAttribute('x1', x1); f.rim[k].setAttribute('y1', py.toFixed(1));
                    f.rim[k].setAttribute('x2', x2); f.rim[k].setAttribute('y2', ny.toFixed(1));
                    f.rim[k].setAttribute('stroke-width', (wf + 2.2).toFixed(2));
                    px = nx; py = ny;
                    grow(px, py);
                }
                // Móng ở đầu ngón
                const nxx = X(px - Math.cos(ang) * 3.6 * sc), nyy = py - Math.sin(ang) * 3.6 * sc;
                f.nail.setAttribute('x1', nxx.toFixed(1)); f.nail.setAttribute('y1', nyy.toFixed(1));
                f.nail.setAttribute('x2', X(px).toFixed(1)); f.nail.setAttribute('y2', py.toFixed(1));
            });

            bb.x0 = minX; bb.x1 = maxX; bb.y0 = minY; bb.y1 = maxY;

            svg.style.opacity = alpha.toFixed(3);
            if (face) {
                face.style.opacity = (alpha * 0.92).toFixed(3);
                face.style.transform = `translateX(${(-m * (1 - r) * FS * 0.7).toFixed(1)}px) rotate(${m * 8}deg)`;
            }

            _sysRaf = requestAnimationFrame(frame);
        }
        _sysRaf = requestAnimationFrame(frame);
        _sysCleanupTimer = setTimeout(_sysCleanup, (SYS_IN + SYS_HOLD + SYS_OUT) * 1000 + 600);
    }

    function _triggerSysDiag(forced) {
        if (_sysBusy || document.hidden || _sysReduceMotion.matches) return;

        try {
            _sysBusy = true;
            const scenario = forced
                ? String(forced).toUpperCase()
                : (Math.random() < 0.5 ? 'A' : 'B');

            if (scenario === 'A') {
                _sysRunPeek();
            } else {
                // Mode B: flash giữa màn hình, bật/tắt cực nhanh như công tắc đèn
                const dur = 0.2 + Math.random() * 0.3;

                const canvas = _sysCreateFaceCanvas(640, 640);
                canvas.className = 'sys-jump run';
                canvas.style.setProperty('--dur', dur.toFixed(2) + 's');

                sysLayer.appendChild(canvas);
                sysLayer.style.setProperty('--dur', dur.toFixed(2) + 's');
                sysLayer.classList.add('active', 'mode-b');

                const wrapper = document.querySelector('.wrapper');
                if (wrapper) {
                    wrapper.classList.remove('sys-shake');
                    void wrapper.offsetWidth;
                    wrapper.classList.add('sys-shake');
                }

                _sysCleanupTimer = setTimeout(_sysCleanup, dur * 1000 + 150);
            }
        } catch (e) {
            console.error('[sys] diagnostic overlay failed:', e);
            _sysCleanup();
        }
    }

    window.triggerSlendrina = _triggerSysDiag;

    /* ============================================================
       USER ID / AUTH
       ============================================================ */
    function getUserId() {
        try {
            let id = localStorage.getItem('mate_user_id');
            if (!id) {
                id = (crypto.randomUUID ? crypto.randomUUID() : 'u-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10));
                localStorage.setItem('mate_user_id', id);
            }
            return id;
        } catch (e) {
            return 'u-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10);
        }
    }
    const USER_ID = getUserId();

    const AUTH_CFG = {
        domain:   "https://ap-southeast-2bgprvp1sb.auth.ap-southeast-2.amazoncognito.com",
        clientId: "2ko9snclu8sr5ql6fq09mfu8nm",
        redirect: location.origin + location.pathname,
        scope:    "openid email profile"
    };
    const AUTH_KEY = 'mate_auth';
    const GUEST_MAX = 2;
    let authNote = '';

    function b64url(bytes) {
        let s = '';
        new Uint8Array(bytes).forEach(b => { s += String.fromCharCode(b); });
        return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function randomString(n) { return b64url(crypto.getRandomValues(new Uint8Array(n))); }
    function readAuth() {
        try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) { return null; }
    }
    function writeAuth(a) {
        try { if (a) localStorage.setItem(AUTH_KEY, JSON.stringify(a)); else localStorage.removeItem(AUTH_KEY); } catch (e) {}
    }
    function jwtPayload(jwt) {
        try {
            const p = jwt.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(p), c => c.charCodeAt(0))));
        } catch (e) { return {}; }
    }
    function currentUser() {
        const a = readAuth();
        return a && a.id ? jwtPayload(a.id) : null;
    }

    async function startLogin() {
        const verifier = randomString(48);
        const state = randomString(16);
        const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
        sessionStorage.setItem('mate_pkce', JSON.stringify({ verifier, state }));
        location.href = AUTH_CFG.domain + '/oauth2/authorize?' + new URLSearchParams({
            response_type: 'code',
            client_id: AUTH_CFG.clientId,
            redirect_uri: AUTH_CFG.redirect,
            scope: AUTH_CFG.scope,
            state,
            code_challenge_method: 'S256',
            code_challenge: challenge,
            identity_provider: 'Google'
        });
    }

    async function tokenRequest(params) {
        const res = await fetch(AUTH_CFG.domain + '/oauth2/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({ client_id: AUTH_CFG.clientId, ...params })
        });
        if (!res.ok) throw new Error('token endpoint ' + res.status);
        return res.json();
    }

    function storeTokens(t, old) {
        const a = {
            access:  t.access_token,
            id:      t.id_token      || (old && old.id),
            refresh: t.refresh_token || (old && old.refresh),
            exp:     Date.now() + (t.expires_in || 3600) * 1000
        };
        writeAuth(a);
        return a;
    }

    async function handleAuthCallback() {
        const p = new URLSearchParams(location.search);
        if (!p.has('code') && !p.has('error')) return;
        if (p.has('error')) console.warn('Cognito login error:', p.get('error'), p.get('error_description'));
        window.history.replaceState(null, '', location.pathname);
        const saved = JSON.parse(sessionStorage.getItem('mate_pkce') || 'null');
        sessionStorage.removeItem('mate_pkce');
        if (p.has('error') || !saved || p.get('state') !== saved.state) {
            authNote = "Login didn't go through, mate. Give it another crack.";
            return;
        }
        try {
            storeTokens(await tokenRequest({
                grant_type: 'authorization_code',
                code: p.get('code'),
                redirect_uri: AUTH_CFG.redirect,
                code_verifier: saved.verifier
            }));
            const u = currentUser();
            authNote = "Logged in" + (u && u.email ? " as " + u.email : "") + ". No more guest limit!";
        } catch (e) {
            console.error('Cognito token exchange failed:', e);
            authNote = "Login didn't go through, mate. Give it another crack.";
        }
    }

    async function getAccessToken() {
        let a = readAuth();
        if (!a) return null;
        if (Date.now() < a.exp - 60000) return a.access;
        if (!a.refresh) { writeAuth(null); renderAuthUI(); return null; }
        try {
            a = storeTokens(await tokenRequest({ grant_type: 'refresh_token', refresh_token: a.refresh }), a);
            return a.access;
        } catch (e) {
            writeAuth(null);
            renderAuthUI();
            return null;
        }
    }

    async function authHeaders() {
        const t = await getAccessToken();
        return t ? { Authorization: 'Bearer ' + t } : {};
    }

    function logout() {
        writeAuth(null);
        location.href = AUTH_CFG.domain + '/logout?' + new URLSearchParams({
            client_id: AUTH_CFG.clientId,
            logout_uri: AUTH_CFG.redirect
        });
    }
    function authClick() { if (readAuth()) logout(); else startLogin(); }

    function renderAuthUI() {
        const btn = document.getElementById('authBtn');
        const hint = document.getElementById('hint');
        const u = currentUser();
        if (btn) {
            btn.textContent = u ? 'Log out' : 'Log in';
            btn.title = u && u.email ? u.email : 'Log in with Google';
        }
        if (hint) {
            hint.textContent = u
                ? 'Signed in' + (u.email ? ' as ' + u.email : '') + '. Keep this tab open to get reminded.'
                : 'Guest: ' + GUEST_MAX + ' reminders max. Log in with Google for more. Keep this tab open.';
        }
        renderProfile();
    }

    function historyKey() {
        const u = currentUser();
        return u && u.sub ? 'mate_chat_history_' + u.sub : 'mate_chat_history';
    }

    /* ============================================================
       PROFILE WIDGET
       ============================================================ */
    function renderProfile() {
        const widget    = document.getElementById('profileWidget');
        const btn       = document.getElementById('profileAvatarBtn');
        const img       = document.getElementById('profileAvatar');
        const fallback  = document.getElementById('profileFallback');
        const emailText = document.getElementById('profileMenuEmailText');
        if (!widget) return;

        const u = currentUser();
        if (!u) {
            widget.classList.add('hidden');
            const menu = document.getElementById('profileMenu');
            if (menu) {
                menu.classList.remove('open');
                menu.setAttribute('aria-hidden', 'true');
            }
            if (btn) btn.setAttribute('aria-expanded', 'false');
            return;
        }
        widget.classList.remove('hidden');

        const email   = u.email || '';
        const name    = u.name || u.given_name || (email ? email.split('@')[0] : '?');
        const picture = u.picture || '';

        fallback.textContent = (String(name).trim().charAt(0) || '?').toUpperCase();

        if (picture) {
            img.src = picture;
            img.style.display = 'block';
            btn.classList.remove('no-img');
            img.onerror = () => {
                img.style.display = 'none';
                btn.classList.add('no-img');
            };
        } else {
            img.style.display = 'none';
            btn.classList.add('no-img');
        }
        emailText.textContent = email || 'No email';
    }

    function toggleProfileMenu() {
        const menu = document.getElementById('profileMenu');
        const btn  = document.getElementById('profileAvatarBtn');
        if (!menu || !btn) return;
        const open = !menu.classList.contains('open');
        menu.classList.toggle('open', open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        menu.setAttribute('aria-hidden', open ? 'false' : 'true');
    }

    (function attachProfileEvents() {
        const btn = document.getElementById('profileAvatarBtn');
        if (!btn) return;

        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleProfileMenu();
        });

        document.addEventListener('click', (e) => {
            const menu = document.getElementById('profileMenu');
            if (menu && menu.classList.contains('open') && !e.target.closest('#profileWidget')) {
                toggleProfileMenu();
            }
        });

        document.addEventListener('keydown', (e) => {
            const menu = document.getElementById('profileMenu');
            if (e.key === 'Escape' && menu && menu.classList.contains('open')) {
                toggleProfileMenu();
            }
        });
    })();

    /* ============================================================
       NOTIFICATIONS
       ============================================================ */
    function updateNotifBanner() {
        if (!('Notification' in window)) {
            notifBanner.classList.add('hidden');
            return;
        }
        if (Notification.permission === 'granted') {
            notifBanner.classList.add('hidden');
            return;
        }
        if (Notification.permission === 'denied') {
            notifBanner.classList.remove('hidden');
            notifBanner.classList.add('blocked');
            notifBannerIcon.textContent = '🔕';
            notifBannerText.textContent = 'Notifications blocked — enable in browser settings';
            notifBanner.onclick = null;
            notifBanner.style.cursor = 'default';
            return;
        }
        notifBanner.classList.remove('hidden', 'blocked');
        notifBannerIcon.textContent = '🔔';
        notifBannerText.textContent = 'Enable desktop notifications';
        notifBanner.style.cursor = 'pointer';
        notifBanner.onclick = requestNotifPermission;
    }

    async function requestNotifPermission() {
        if (!('Notification' in window)) return;
        try {
            const result = await Notification.requestPermission();
            updateNotifBanner();
            if (result === 'granted') {
                new Notification('Notifications on!', {
                    body: 'You\'ll get pinged here even when the tab is hidden.',
                    icon: ROO_IMG,
                    tag: 'notif-test'
                });
            }
        } catch (e) {
            console.error('Notification request failed:', e);
        }
    }

    function showSystemNotification(reminder) {
        if (!('Notification' in window) || Notification.permission !== 'granted') return;
        try {
            const title = '🚨 ' + (reminder.task || 'Reminder');
            const body = 'Your reminder just went off.';
            const n = new Notification(title, {
                body,
                icon: ROO_IMG,
                tag: reminder.id || 'reminder-' + Date.now(),
                requireInteraction: true
            });
            n.onclick = () => { window.focus(); n.close(); };
        } catch (e) {
            console.error('Notification failed:', e);
        }
    }

    /* ============================================================
       ALARM HISTORY
       ============================================================ */
    function normalizeTaskText(text) {
        return (text || '').toLowerCase().replace(/[!?.]+$/g, '').replace(/\s+/g, ' ').trim();
    }

    function loadAlarmHistory() {
        try { return JSON.parse(localStorage.getItem(ALARM_HISTORY_KEY) || '[]'); }
        catch (e) { return []; }
    }

    function recordAlarmFired(reminder) {
        const h = loadAlarmHistory();
        h.push({
            task: reminder.task || 'Reminder',
            at: Date.now(),
            id: reminder.id || null
        });
        try { localStorage.setItem(ALARM_HISTORY_KEY, JSON.stringify(h.slice(-MAX_ALARM_HISTORY))); } catch (e) {}
        updateHistoryBadge();
        renderFamiliarBar();
    }

    function getFamiliarTasks() {
        const h = loadAlarmHistory();
        const counts = {};
        h.forEach(item => {
            const key = normalizeTaskText(item.task);
            if (!key) return;
            if (!counts[key]) counts[key] = { task: item.task, count: 0, lastAt: 0 };
            counts[key].count++;
            counts[key].lastAt = Math.max(counts[key].lastAt, item.at || 0);
        });
        return Object.values(counts)
            .filter(c => c.count >= 2)
            .sort((a, b) => b.count - a.count || b.lastAt - a.lastAt)
            .slice(0, 5);
    }

    function updateHistoryBadge() {
        const btn = document.getElementById('historyBtn');
        if (!btn) return;
        const n = loadAlarmHistory().length;
        if (n > 0) {
            btn.classList.add('has-badge');
            btn.setAttribute('data-badge', n > 99 ? '99+' : String(n));
        } else {
            btn.classList.remove('has-badge');
            btn.removeAttribute('data-badge');
        }
    }

    function renderFamiliarBar() {
        if (!familiarBar) return;
        const items = getFamiliarTasks();
        if (items.length === 0) {
            familiarBar.classList.remove('show');
            familiarBar.innerHTML = '';
            return;
        }
        familiarBar.classList.add('show');
        familiarBar.innerHTML = '';
        const label = document.createElement('span');
        label.className = 'familiar-label';
        label.textContent = '🔥 Often';
        familiarBar.appendChild(label);
        items.forEach(item => {
            const chip = document.createElement('button');
            chip.className = 'familiar-chip';
            chip.type = 'button';
            const text = document.createElement('span');
            text.textContent = item.task;
            const count = document.createElement('span');
            count.className = 'count';
            count.textContent = '×' + item.count;
            chip.appendChild(text);
            chip.appendChild(count);
            chip.addEventListener('click', () => {
                userInput.value = item.task;
                userInput.focus();
                userInput.dispatchEvent(new Event('input'));
            });
            familiarBar.appendChild(chip);
        });
    }

    /* ============================================================
       HISTORY PANEL
       ============================================================ */
    const historyPanel = document.getElementById('historyPanel');
    const historyBody = document.getElementById('historyBody');

    function openHistory() {
        renderHistoryPanel();
        historyPanel.classList.add('open');
        historyPanel.setAttribute('aria-hidden', 'false');
    }
    function closeHistory() {
        historyPanel.classList.remove('open');
        historyPanel.setAttribute('aria-hidden', 'true');
    }
    function renderHistoryPanel() {
        const items = loadAlarmHistory().slice().reverse();
        historyBody.innerHTML = '';
        if (items.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'history-empty';
            empty.textContent = 'No alarms fired yet. Set one and wait for the bell 🔔';
            historyBody.appendChild(empty);
            return;
        }
        items.forEach(item => {
            const row = document.createElement('div');
            row.className = 'history-item';
            const icon = document.createElement('span');
            icon.className = 'history-item-icon';
            icon.textContent = '🔔';
            const content = document.createElement('div');
            content.className = 'history-item-content';
            const task = document.createElement('div');
            task.className = 'history-item-task';
            task.textContent = item.task;
            const meta = document.createElement('div');
            meta.className = 'history-item-meta';
            const when = new Date(item.at);
            const dateStr = when.toLocaleDateString('en-AU', { day: '2-digit', month: 'short' });
            const timeStr = when.toLocaleTimeString('en-AU', { hour: '2-digit', minute: '2-digit', hour12: false });
            meta.textContent = `${dateStr} · ${timeStr}`;
            content.appendChild(task);
            content.appendChild(meta);
            row.appendChild(icon);
            row.appendChild(content);
            row.addEventListener('click', () => {
                userInput.value = item.task;
                userInput.focus();
                userInput.dispatchEvent(new Event('input'));
                closeHistory();
            });
            historyBody.appendChild(row);
        });
    }

    document.getElementById('historyClose').addEventListener('click', closeHistory);
    document.getElementById('historyDone').addEventListener('click', closeHistory);
    document.getElementById('historyClear').addEventListener('click', () => {
        if (confirm('Clear alarm history?')) {
            localStorage.removeItem(ALARM_HISTORY_KEY);
            updateHistoryBadge();
            renderFamiliarBar();
            renderHistoryPanel();
        }
    });
    historyPanel.addEventListener('click', e => { if (e.target === historyPanel) closeHistory(); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && historyPanel.classList.contains('open')) closeHistory(); });

    /* ============================================================
       SOUND
       ============================================================ */
    let isSoundEnabled = false;
    const UNLOCK_EVENTS = ['click', 'touchend', 'pointerup', 'keydown'];
    const lockedQueue = [];

    function unlockSound() {
        if (isSoundEnabled) return;
        currentAudioObj.muted = true;
        currentAudioObj.play().then(() => {
            currentAudioObj.pause();
            currentAudioObj.currentTime = 0;
            currentAudioObj.muted = false;
            isSoundEnabled = true;
            UNLOCK_EVENTS.forEach(ev => document.removeEventListener(ev, unlockSound));
            const b = document.getElementById('soundBanner');
            if (b) b.classList.add('hidden');
            if (lockedQueue.length) enqueueReminderAudio(lockedQueue.splice(0));
        }).catch(() => { currentAudioObj.muted = false; });
    }
    UNLOCK_EVENTS.forEach(ev => document.addEventListener(ev, unlockSound));

    function pickBellUrl() { return audioList[Math.floor(Math.random() * audioList.length)]; }

    let voiceMode = 'special';
    try {
        const saved = localStorage.getItem('mate_voice_mode');
        if (saved === 'original' || saved === 'special') voiceMode = saved;
    } catch (e) {}

    function renderModeBtn() {
        const b = document.getElementById('modeBtn');
        if (b) b.textContent = voiceMode === 'special' ? '🎙️ Special' : '🔔 Original';
    }
    function toggleMode() {
        voiceMode = voiceMode === 'special' ? 'original' : 'special';
        try { localStorage.setItem('mate_voice_mode', voiceMode); } catch (e) {}
        renderModeBtn();
        appendMessage(
            voiceMode === 'special'
                ? "Special mode on, mate! Ya'll get the proper voice 🎙️"
                : "Original mode on! Back to the good old bell 🔔",
            'bot', null, false
        );
    }
    renderModeBtn();

    function reminderAudioUrl(reminder) {
        if (voiceMode !== 'special' || !reminder || typeof reminder !== 'object' ||
            reminder.audioStatus !== 'READY' || !reminder.audioS3Key) return null;
        return AUDIO_BASE_URL + String(reminder.audioS3Key).split('/').map(s => encodeURIComponent(s)).join('/');
    }

    const audioQueue = [];
    let queuePlaying = false;

    function enqueueReminderAudio(reminders) {
        if (!isSoundEnabled) {
            lockedQueue.push(...reminders);
            const b = document.getElementById('soundBanner');
            if (b) { b.classList.remove('hidden'); b.textContent = '🔊 Reminder fired! Tap here to hear it'; }
            try { if (navigator.vibrate) navigator.vibrate([300, 150, 300]); } catch (e) {}
            return;
        }
        audioQueue.push(...reminders);
        if (!queuePlaying) playNextInQueue();
    }

    function playNextInQueue() {
        const reminder = audioQueue.shift();
        if (!reminder) { queuePlaying = false; return; }
        queuePlaying = true;
        const el = currentAudioObj;
        const ttsUrl = reminderAudioUrl(reminder);
        let stage = ttsUrl ? 'tts' : 'bell';
        const failed = {};
        const next = () => { el.onended = null; el.onerror = null; playNextInQueue(); };
        const start = url => {
            el.src = url; el.currentTime = 0; el.volume = 0.8;
            el.play().catch(fail);
        };
        function fail(err) {
            if (failed[stage]) return;
            failed[stage] = true;
            console.error('Audio failed (' + stage + '):', err);
            if (stage === 'tts') { stage = 'bell'; start(pickBellUrl()); }
            else { next(); }
        }
        el.onended = next;
        el.onerror = fail;
        start(ttsUrl || pickBellUrl());
    }

    /* ============================================================
       LOAD / HISTORY
       ============================================================ */
    window.onload = async () => {
        await handleAuthCallback();
        renderAuthUI();
        updateNotifBanner();
        updateHistoryBadge();
        renderFamiliarBar();

        const history = JSON.parse(localStorage.getItem(historyKey()) || '[]');
        if (history.length === 0) {
            appendMessage("Scarnon? Put a task in and I'll remind ya! ✨", 'bot', null, false);
        } else {
            history.forEach(m => {
                if (m.side === 'remind-alert') {
                    const reminder = m.reminder || { task: (m.txt || '').replace(/^🚨\s*OI\s*OI\s*OI!\s*/i, '') };
                    appendAlarmCard(reminder, m.at || Date.now(), false);
                } else {
                    appendMessage(m.txt, m.side, null, false, false, m.at || Date.now());
                }
            });
            chips.style.display = 'none';
        }
        if (authNote) appendMessage(authNote, 'bot', null, false);
        autoCheck();
    };

    function saveHistory(txt, side, at, extra) {
        const history = JSON.parse(localStorage.getItem(historyKey()) || '[]');
        const entry = { txt, side, at, ...(extra || {}) };
        history.push(entry);
        localStorage.setItem(historyKey(), JSON.stringify(history.slice(-50)));
    }

    function clearHistory() {
        if (confirm("Delete all chat history?")) {
            localStorage.removeItem(historyKey());
            chatBox.innerHTML = '';
            lastMessageAt = 0;
            appendMessage("History cleared, mate!", 'bot', null, false);
            chips.style.display = 'flex';
        }
    }

    function useChip(el) {
        userInput.value = el.innerText.replace(/\s*[\u{1F300}-\u{1FAFF}]\s*$/u, '');
        userInput.focus();
        userInput.dispatchEvent(new Event('input'));
    }

    /* ============================================================
       SEND
       ============================================================ */
    async function talkToBot(payload) {
        const tid = 'l-' + Date.now();
        appendMessage("", 'bot', tid, false, true);

        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
        try {
            const res = await fetch(SEND_URL, {
                method: 'POST',
                headers: await authHeaders(),
                body: JSON.stringify({ user_id: USER_ID, voice_mode: voiceMode, ...payload }),
                signal: controller.signal
            });
            const data = await res.json();
            const loadingMsg = document.getElementById(tid);
            if (loadingMsg) loadingMsg.remove();

            if (res.status === 401) {
                writeAuth(null);
                renderAuthUI();
                appendLoginPrompt(data.message || "Your login's expired, mate. Log in again.");
            } else if (data.needs_confirm && data.pending_id) {
                appendConfirm(data.message || "Keep this tab open, yeah?", data.pending_id);
            } else if (data.login_required) {
                appendLoginPrompt(data.message || "Log in with Google for more, mate.");
            } else {
                appendMessage(data.message || "Righto!", 'bot');
            }


            if (_sysIsMalicious(data)) _triggerSysDiag();
        } catch (e) {
            const loadingMsg = document.getElementById(tid);
            if (loadingMsg) loadingMsg.remove();
            appendMessage(
                e && e.name === 'AbortError'
                    ? "Server's slow as, mate. It might've saved, so check before ya retry!"
                    : "Bloody hell, error!",
                'bot'
            );
        } finally {
            clearTimeout(timer);
        }
    }

    async function handleSend() {
        unlockSound();
        const text = userInput.value.trim();
        if (!text) return;
        chips.style.display = 'none';
        appendMessage(text, 'user');
        userInput.value = '';
        updateSendBtn();
        const payload = { task_input: text };
        await talkToBot(payload);
    }

    function updateSendBtn() {
        if (sendBtn) sendBtn.disabled = !userInput.value.trim();
    }
    userInput.addEventListener('input', updateSendBtn);
    updateSendBtn();

    function appendLoginPrompt(txt) {
        const row = appendMessage(txt, 'bot');
        const wrap = document.createElement('div');
        wrap.className = 'confirm-row';
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'confirm-btn yes';
        b.textContent = 'Log in with Google';
        b.addEventListener('click', startLogin);
        wrap.appendChild(b);
        row.querySelector('.msg').appendChild(wrap);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendConfirm(txt, pendingId) {
        const row = appendMessage(txt, 'bot');
        const wrap = document.createElement('div');
        wrap.className = 'confirm-row';
        const options = [
            { action: 'confirm', label: 'Yeah, keep it open', cls: 'yes' },
            { action: 'cancel',  label: 'Nah, forget it',     cls: 'no' }
        ];
        options.forEach(o => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'confirm-btn ' + o.cls;
            b.textContent = o.label;
            b.addEventListener('click', async () => {
                unlockSound();
                wrap.querySelectorAll('button').forEach(x => { x.disabled = true; });
                b.classList.add('picked');
                appendMessage(o.label, 'user');
                await talkToBot({ action: o.action, pending_id: pendingId });
            });
            wrap.appendChild(b);
        });
        row.querySelector('.msg').appendChild(wrap);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    /* ============================================================
       POLLING
       ============================================================ */
    let checking = false;
    const recentlyFired = new Map();

    function isDuplicate(reminder) {
        const key = reminder.id || ('task:' + normalizeTaskText(reminder.task));
        const now = Date.now();
        for (const [k, v] of recentlyFired) {
            if (now - v > DEDUPE_TTL) recentlyFired.delete(k);
        }
        if (recentlyFired.has(key) && now - recentlyFired.get(key) < DEDUPE_TTL) return true;
        recentlyFired.set(key, now);
        return false;
    }

    function normalizeReminder(r) {
        if (typeof r === 'string') {
            return { task: r, id: null, audioStatus: 'LEGACY' };
        }
        return {
            task: r.task || r.Task || r.message || r.text || r.title || r.content || '',
            id: r.id || r.reminder_id || r.reminderId || null,
            audioStatus: r.audioStatus || 'LEGACY',
            audioS3Key: r.audioS3Key || null
        };
    }

    async function autoCheck() {
        if (checking) return;
        checking = true;
        try {
            const res = await fetch(CHECK_URL + '?userId=' + encodeURIComponent(USER_ID), {
                cache: 'no-store',
                headers: await authHeaders()
            });
            if (res.status === 401) { writeAuth(null); renderAuthUI(); return; }
            if (!res.ok) return;
            const data = await res.json();
            const raw = data.reminders || [];
            const reminders = raw.map(normalizeReminder);

            const fresh = reminders.filter(r => !isDuplicate(r));
            if (fresh.length === 0) return;

            enqueueReminderAudio(fresh);
            flashAlarm();
            flashClock();

            fresh.forEach(reminder => {
                appendAlarmCard(reminder, Date.now(), true);
                recordAlarmFired(reminder);
                if (document.hidden) showSystemNotification(reminder);
            });

            if (document.hidden) document.title = '🚨 Reminder!';
        } catch (e) {
            console.error(e);
        } finally {
            checking = false;
        }
    }

    document.addEventListener('visibilitychange', () => {
        if (!document.hidden) {
            document.title = ORIGINAL_TITLE;
            autoCheck();
        }
    });

    setInterval(autoCheck, POLL_MS);

    /* ============================================================
       RENDER
       ============================================================ */
    function appendAlarmCard(reminder, when, save) {
        const row = document.createElement('div');
        row.className = 'row remind-alert';

        const card = document.createElement('div');
        card.className = 'alarm-card';

        const label = document.createElement('div');
        label.className = 'alarm-label';
        label.textContent = 'Alarm';

        const task = document.createElement('div');
        task.className = 'alarm-task';
        task.textContent = reminder.task || 'Reminder';

        const time = document.createElement('div');
        time.className = 'alarm-time';
        const d = new Date(when);
        time.textContent = 'fired · ' + d.toLocaleTimeString('en-AU', { hour12: false });

        card.appendChild(label);
        card.appendChild(task);
        card.appendChild(time);

        row.appendChild(card);
        chatBox.appendChild(row);
        chatBox.scrollTop = chatBox.scrollHeight;
        lastMessageAt = when;

        if (save) {
            saveHistory(null, 'remind-alert', when, { reminder });
        }
        return row;
    }

    function appendMessage(txt, side, id, save = true, typing = false, at = null) {
        if (side === 'remind-alert') {
            const reminder = { task: (txt || '').replace(/^🚨\s*OI\s*OI\s*OI!\s*/i, '') };
            return appendAlarmCard(reminder, at || Date.now(), save);
        }

        const when = at || Date.now();
        const now = new Date(when);

        const row = document.createElement('div');
        row.className = 'row ' + side;
        if (id) row.id = id;

        if (side === 'bot') {
            const spark = document.createElement('div');
            spark.className = 'spark';
            const im = document.createElement('img');
            im.src = ROO_IMG;
            im.alt = 'DeMinh DeRozan';
            im.onerror = () => { spark.innerHTML = SPARK_SVG; };
            spark.appendChild(im);
            row.appendChild(spark);
        }

        const d = document.createElement('div');
        d.className = 'msg ' + side;
        if (typing) {
            d.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
        } else {
            d.innerText = txt;
        }

        const t = document.createElement('div');
        t.className = 'msg-time';
        t.textContent = fmtHM(now);

        const stack = document.createElement('div');
        stack.style.display = 'flex';
        stack.style.flexDirection = 'column';
        stack.appendChild(d);
        stack.appendChild(t);
        row.appendChild(stack);

        chatBox.appendChild(row);

        if (!typing) applyGapAndAge(row, when, false);

        chatBox.scrollTop = chatBox.scrollHeight;
        if (save) saveHistory(txt, side, when);
        return row;
    }

    userInput.addEventListener('keydown', e => {
        if (e.key === 'Enter') handleSend();
    });

    
    function updateScrollBtn() {
        const gap = chatBox.scrollHeight - chatBox.scrollTop - chatBox.clientHeight;
        scrollBottom.classList.toggle('show', gap > 300);
    }
    chatBox.addEventListener('scroll', updateScrollBtn);
    scrollBottom.addEventListener('click', () => {
        chatBox.scrollTo({ top: chatBox.scrollHeight, behavior: 'smooth' });
    });
    updateScrollBtn();

    
    (function () {
        const lb = document.getElementById('lb');
        const lbImg = document.getElementById('lbImg');
        document.querySelectorAll('.logo img').forEach(i => { i.src = ROO_IMG; });
        function openLb() { lbImg.src = ROO_IMG; lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false'); }
        function closeLb() { lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); }
        document.addEventListener('click', e => {
            if (e.target.closest('.logo, .spark')) openLb();
        });
        lb.addEventListener('click', e => { if (e.target !== lbImg) closeLb(); });
        document.getElementById('lbClose').addEventListener('click', closeLb);
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLb(); });
    })();
