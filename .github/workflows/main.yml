name: Deploy

on:
  push:
    branches: [main, master]
    paths:
      - 'Terraform/**'
      - 'web/**'
      - 'lambda/**'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger private deployment
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/DeMinhDeRozan/FunReminder_GitHubActions/dispatches \
            -f event_type=deploy
